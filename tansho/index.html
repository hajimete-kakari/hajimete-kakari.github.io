<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>面接で短所を答える｜はじめての係</title>
<style>
  :root {
    --bg: #faf8f5; --card: #ffffff; --text: #2b2b2b; --sub: #6b6b6b;
    --line: #e4dfd8; --accent: #2f6f5e; --accent-soft: #e6f0ec; --input: #fffbe8;
    --warn: #a4412f; --warn-soft: #f8e9e5; --mus: #c99a2e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --card: #26262a; --text: #ececec; --sub: #a5a5a5;
      --line: #3a3a3f; --accent: #7cc4ad; --accent-soft: #23372f; --input: #2e2c22;
      --warn: #f0a08f; --warn-soft: #3d2622; --mus: #e3c578;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", "Meiryo", sans-serif; line-height: 1.7; font-size: 16px; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 0 0 10px; }
  h3 { font-size: .98rem; margin: 18px 0 6px; }
  .lead { color: var(--sub); font-size: .9rem; margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  label.f { display: block; font-weight: 600; margin: 14px 0 6px; }
  .card > label.f:first-of-type { margin-top: 0; }
  .hint { font-weight: 400; color: var(--sub); font-size: .85rem; display: block; }
  input[type=text], select { width: 100%; font-size: 1rem; padding: 9px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--input); color: var(--text); font-family: inherit; }
  button { width: 100%; font-size: 1rem; font-weight: 700; padding: 12px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; margin-top: 18px; cursor: pointer; font-family: inherit; }
  @media (prefers-color-scheme: dark) { button { color: #10231d; } }
  .copy { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 9px; font-size: .92rem; margin-top: 10px; }
  .big { border-radius: 10px; padding: 12px; margin-bottom: 8px; background: var(--accent-soft); }
  .big .k { font-size: .85rem; color: var(--sub); }
  .big .v { font-size: 1.05rem; font-weight: 700; }
  .big .s { font-size: .88rem; }
  .mail { white-space: pre-wrap; word-break: break-all; background: var(--input); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: .92rem; }
  .ng { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: .9rem; white-space: pre-wrap; }
  .err { color: var(--warn); font-size: .9rem; margin-top: 10px; }
  .note { font-size: .8rem; color: var(--sub); }
  [hidden] { display: none !important; }
  .mihon #sum .v, .mihon #sum .s, .mihon #say, .mihon #short, .mihon #more, .mihon #ng { filter: blur(6px); user-select: none; }
</style>
</head>
<body>
<main>
  <h1>面接で短所を答える</h1>
  <p class="lead">面接で「あなたの短所は何ですか」と聞かれたときに、そのまま言える答えを作ります。短所と、実際にしている工夫を選ぶと、答え、短い答え、続けて聞かれたときの返し方が出ます。入力した内容は、このページの外には送られません。</p>

  <div class="card">
    <h2>1. 短所と工夫</h2>
    <label class="f" for="kind">自分に近い短所</label>
    <select id="kind">
      <option value="worry">心配性で、確認に時間をかけすぎる</option>
      <option value="slow">慎重で、決めるまでに時間がかかる</option>
      <option value="hold">頼まれると断れず、抱え込む</option>
      <option value="ask">人に頼るのが苦手で、一人で進める</option>
      <option value="nerve">緊張しやすく、人前で言葉に詰まる</option>
      <option value="detail">細かいところが気になり、進みが遅くなる</option>
      <option value="focus">集中すると、周りが見えなくなる</option>
      <option value="rush">結論を急いで、確かめが足りなくなる</option>
      <option value="other">どれも近くない（自分で入れる）</option>
    </select>
    <div id="otherBox">
      <label class="f" for="other">自分の短所<span class="hint">「〜ところです」に続く形で</span></label>
      <input type="text" id="other" placeholder="例：話が長くなりがちな">
    </div>
    <label class="f" for="fix">実際にしている工夫<span class="hint">していないことは選ばないでください</span></label>
    <select id="fix"></select>
    <div id="fixBox">
      <label class="f" for="fixFree">自分の工夫<span class="hint">「〜ようにしております」に続く形で</span></label>
      <input type="text" id="fixFree" placeholder="例：先に結論を言ってから話す">
    </div>
    <h2 id="sec2" style="margin-top:20px">2. 応募する仕事との関係</h2>
    <label class="f" for="fit">この短所は、応募する仕事の中心と重なりますか</label>
    <select id="fit">
      <option value="no">あまり重ならない</option>
      <option value="some">重なる場面が少しある</option>
      <option value="yes">仕事の中心と大きく重なる</option>
    </select>
    <h2 id="sec3" style="margin-top:20px">3. 言葉を足す</h2>
    <label class="f" for="scene">実際にあった場面<span class="hint">なければ空のまま。「〜ことがありました」に続く形で</span></label>
    <input type="text" id="scene" placeholder="例：見積書の確認に時間をかけて、出すのが夕方になる">
    <label class="f" for="res">工夫して変わったこと<span class="hint">なければ空のまま。「〜ようになりました」に続く形で</span></label>
    <input type="text" id="res" placeholder="例：余裕を持って見積書を出せる">
    <label class="f" for="job">応募している職種<span class="hint">なければ空のまま</span></label>
    <input type="text" id="job" placeholder="例：営業事務">
  </div>
  <button id="make" type="button">答えを作る</button>
  <p class="err" id="err" hidden></p>

  <div class="card" id="result" hidden style="margin-top:16px">
    <h2>できあがり</h2>
    <div id="sum"></div>
    <h3>そのまま言える答え</h3>
    <div class="mail" id="say"></div>
    <button type="button" class="copy" data-t="say">答えをコピー</button>
    <h3>短く答えるとき</h3>
    <div class="mail" id="short"></div>
    <button type="button" class="copy" data-t="short">短い答えをコピー</button>
    <h3>続けて聞かれたら</h3>
    <div class="mail" id="more"></div>
    <h3>避けたい言い方</h3>
    <div class="ng" id="ng"></div>
  </div>

  <p class="note">※話し方の目安です。受かるかどうかを約束するものではありません。長さは1分300字で数えた目安で、話す速さによって変わります。<br>
  最終更新：2026年11月　はじめての係</p>
</main>

<script>
(function () {
  var DEMO = location.search.indexOf("demo") >= 0;
  if (location.search.indexOf("mihon") >= 0) document.body.className = "mihon";
  function $(id) { return document.getElementById(id); }
  // 短所ごとの言葉：t=短所の文、g=裏返しの長所、f=工夫
  var D = {
    worry: { t: "心配性で、確認に時間をかけすぎてしまうところ", g: "丁寧に確認できるところ",
      f: ["確認の終わりの時間を先に決める", "確認する項目を書き出して、順に見る", "迷ったときは早めに周りの人に見てもらう"] },
    slow: { t: "慎重になりすぎて、決めるまでに時間がかかるところ", g: "よく考えてから進められるところ",
      f: ["決める期限を先に決める", "迷っている点を書き出して、早めに相談する", "小さなことは、その場で決める"] },
    hold: { t: "頼まれると断れず、仕事を抱え込んでしまうところ", g: "頼まれた仕事に責任を持って取り組めるところ",
      f: ["引き受ける前に、今の仕事の量と期限を確かめる", "間に合わなそうなときは、早めに相談する", "抱えている仕事を一覧にして、周りと共有する"] },
    ask: { t: "人に頼るのが苦手で、一人で進めてしまうところ", g: "自分で考えて進められるところ",
      f: ["相談する時間を先に決めておく", "進みぐあいを途中で共有する", "聞きたいことをまとめて、早めに聞く"] },
    nerve: { t: "緊張しやすく、人前で話すときに言葉に詰まるところ", g: "事前にしっかり準備できるところ",
      f: ["話す順番を先にメモしておく", "事前に声に出して練習する", "はじめに結論から話す"] },
    detail: { t: "細かいところが気になり、全体の進みが遅くなることがあるところ", g: "細かいところまで気を配れるところ",
      f: ["はじめに全体の予定を決める", "先に最後まで一度作ってから直す", "どこまで仕上げるかを先に確かめる"] },
    focus: { t: "一つのことに集中すると、周りが見えなくなるところ", g: "一つのことに集中して取り組めるところ",
      f: ["時間を区切って予定を確かめる", "手を止めて連絡を確かめる時間を決める", "朝に、その日の優先順位を書き出す"] },
    rush: { t: "結論を急いで、確かめが足りなくなることがあるところ", g: "すばやく動けるところ",
      f: ["出す前に一度、読み直す時間をとる", "相手の話を最後まで聞いてから答える", "確かめる点を一覧にしておく"] }
  };
  // 見本画像では入力の一部だけにして、結果の並びが入るようにする
  if (document.body.className === "mihon") {
    ["scene", "res", "job"].forEach(function (id) { $(id).hidden = true; document.querySelector('label[for="' + id + '"]').hidden = true; });
    $("sec3").hidden = true;
  }
  // 前後の空白と、文の終わりの記号を取る
  function v(id) { return $(id).value.trim().replace(/[。、．，]+$/, ""); }
  function len(t) { return t.replace(/\s/g, "").length; }
  function sec(t) { return Math.round(len(t) / 5); }
  // 短所に合わせて、工夫の選択肢と入力欄を出し分ける
  function fill() {
    var k = $("kind").value, sel = $("fix"), list = k === "other" ? [] : D[k].f;
    sel.innerHTML = "";
    list.forEach(function (x) { var o = document.createElement("option"); o.value = x; o.textContent = x; sel.appendChild(o); });
    var m = document.createElement("option"); m.value = "__free"; m.textContent = "自分で入れる"; sel.appendChild(m);
    show();
  }
  function show() {
    var k = $("kind").value;
    $("otherBox").hidden = k !== "other";
    $("fix").parentNode.querySelector('label[for="fix"]').hidden = k === "other";
    $("fix").hidden = k === "other";
    $("fixBox").hidden = $("fix").value !== "__free";
  }
  function make() {
    var k = $("kind").value, fit = $("fit").value, other = k === "other", err = "";
    var own = v("other").replace(/(ところ(です)?|点(です)?|です)$/, "");
    var fix = $("fix").value === "__free" ? v("fixFree").replace(/(ように(して(おります|います|いる)|する)|ようにします)$/, "") : $("fix").value;
    if (other && !own) err = "自分の短所を入れてください。";
    else if (!fix) err = "実際にしている工夫を入れてください。";
    $("err").textContent = err; $("err").hidden = !err;
    if (err) { $("result").hidden = true; return false; }
    var t = other ? own + "ところ" : D[k].t;
    var scene = v("scene").replace(/(ことが(ありました|あります|あった|ある))$/, "");
    var res = v("res").replace(/(ようになりました|ようになった|ようになる)$/, "");
    var job = v("job").replace(/の仕事$/, "");
    // 答え：短所→場面→工夫→変わったこと→この仕事で
    var a = "私の短所は、\n" + t + "です。";
    var b = scene ? "これまでの仕事でも、\n" + scene + "\nことがありました。" : "";
    var c = (fit === "yes" ? "そのため、仕事に支障が出ないよう、\n今は、" : "そのため今は、\n") + fix + "\nようにしております。" + (res ? "\nその結果、" + res + "\nようになりました。" : "");
    var d = (job ? "御社の" + job + "の仕事でも、\n" : "御社でも、\n") + (fit === "no" ? "この工夫を続けながら、\n取り組みたいと考えております。" : "困ったときは早めに相談しながら、\n取り組みたいと考えております。");
    var say = a + (b ? "\n\n" + b : "") + "\n\n" + c + "\n\n" + d;
    $("say").textContent = say;
    var sh = "短所は、" + t + "です。\n今は、" + fix + "ようにしております。";
    $("short").textContent = sh;
    // 結果の見出し
    var s = $("sum"); s.innerHTML = "";
    function card(key, val, sub) {
      var el = document.createElement("div"); el.className = "big";
      el.innerHTML = '<div class="k"></div><div class="v"></div><div class="s"></div>';
      el.querySelector(".k").textContent = key; el.querySelector(".v").textContent = val; el.querySelector(".s").textContent = sub;
      s.appendChild(el);
    }
    card("答える順番", "短所" + (scene ? "→あった場面" : "") + "→今の工夫" + (res ? "→変わったこと" : "") + "→入社後", "順番を覚えておけば、言葉が少し変わってもかまいません。");
    card("仕事との関係", { no: "工夫まで話せば足りる", some: "工夫を具体的に言う", yes: "工夫と相談の仕方まで言う" }[fit],
      { no: "仕事の中心と重なりにくい短所です。短く言って、工夫の話に移ります。",
        some: "重なる場面があるので、どんなときに、どう工夫しているかまで話します。",
        yes: "仕事の中心と重なります。ほかにも本当に思い当たる短所があるなら、そちらを話すことも考えます。ない短所を作ることはしません。" }[fit]);
    card("話す長さ", len(say) + "字・およそ" + sec(say) + "秒", sec(say) > 40 ? "長めです。聞かれたことへの答えなので、「短く答えるとき」から話しはじめてもかまいません。" : sec(say) > 20 ? "少し長めです。時間がなさそうなときは、「短く答えるとき」を話します。" : "短く話せる長さです。声に出して計ると、自分の速さがわかります。");
    // 続けて聞かれたら
    var more = "■「それで失敗したことはありますか」\n" +
      (scene ? "はい。\n" + scene + "\nことがありました。\nそれからは、" + fix + "\nようにしております。" :
        "はい、ございます。\n（実際にあったことを1つ、\n短く話します）\nそれからは、" + fix + "\nようにしております。");
    more += "\n\n■「その短所は直せそうですか」\nすぐにすべてを変えるのは\n難しいと思っておりますが、\n" + fix + "ことで、\n仕事に影響が出ないようにしております。";
    if (fit !== "no") more += "\n\n■「この仕事で困りませんか」\n困る場面もあると思っております。\nそのときは、" + fix + "\nようにして、早めに相談いたします。";
    more += "\n\n■「反対に、長所は何ですか」\n" + (other ? "（短所の裏返しになる長所を、\n1つ話します）" : "私の長所は、\n" + D[k].g + "です。\n（自分に当てはまるときだけ使います）");
    $("more").textContent = more;
    // 避けたい言い方
    var ng = "・「短所はありません」と言う\n　→聞かれたことに答えていないと受け取られることがあります\n" +
      "・短所だけ言って終える\n　→今の工夫まで話します\n" +
      "・「頑張りすぎるところです」のように、長所を言い換えただけで答える\n　→聞かれたことからずれてしまいます\n" +
      "・していない工夫を話す\n　→くわしく聞かれると答えられません\n" +
      "・前の会社や上司のせいにする\n";
    if (fit === "yes") ng += "・「苦手です」で言い切る\n　→工夫と相談の仕方まで話します\n";
    ng += "・遅刻や約束を忘れるなど、働くうえでの基本にかかわることを、工夫なしで話す";
    $("ng").textContent = ng;
    $("result").hidden = false;
    return true;
  }
  [].forEach.call(document.querySelectorAll(".copy"), function (b) {
    b.addEventListener("click", function () {
      var txt = $(b.getAttribute("data-t")).textContent, label = b.textContent;
      var ok = function () { b.textContent = "コピーしました"; setTimeout(function () { b.textContent = label; }, 1500); };
      function fallback() {
        var ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta);
        ta.select(); try { document.execCommand("copy"); ok(); } catch (err) {} document.body.removeChild(ta);
      }
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(ok, fallback); else fallback();
    });
  });
  $("kind").addEventListener("change", fill);
  $("fix").addEventListener("change", show);
  $("make").addEventListener("click", function () { if (make() && !DEMO) $("result").scrollIntoView({ behavior: "smooth" }); });
  fill();
  if (DEMO) {
    $("kind").value = "worry"; fill(); $("fix").value = D.worry.f[0]; $("fit").value = "some";
    $("scene").value = "見積書の確認に時間をかけて、出すのが夕方になる"; $("res").value = "余裕を持って見積書を出せる"; $("job").value = "営業事務";
    show(); make();
  }
})();
</script>
</body>
</html>
