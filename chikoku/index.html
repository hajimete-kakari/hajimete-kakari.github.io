<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>遅刻しそうな朝の連絡｜はじめての係</title>
<style>
  :root {
    --bg: #faf8f5; --card: #ffffff; --text: #2b2b2b; --sub: #6b6b6b;
    --line: #e4dfd8; --accent: #2f6f5e; --accent-soft: #e6f0ec; --input: #fffbe8;
    --warn: #a4412f; --warn-soft: #f8e9e5; --mus: #c99a2e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --card: #26262a; --text: #ececec; --sub: #a5a5a5;
      --line: #3a3a3f; --accent: #7cc4ad; --accent-soft: #23372f; --input: #2e2c22;
      --warn: #f0a08f; --warn-soft: #3d2622; --mus: #e3c578;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", "Meiryo", sans-serif; line-height: 1.7; font-size: 16px; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 0 0 10px; }
  h3 { font-size: .98rem; margin: 18px 0 6px; }
  .lead { color: var(--sub); font-size: .9rem; margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  label.f { display: block; font-weight: 600; margin: 14px 0 6px; }
  .card > label.f:first-of-type { margin-top: 0; }
  .hint { font-weight: 400; color: var(--sub); font-size: .85rem; display: block; }
  input[type=text], select { width: 100%; font-size: 1rem; padding: 9px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--input); color: var(--text); font-family: inherit; }
  button { width: 100%; font-size: 1rem; font-weight: 700; padding: 12px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; margin-top: 18px; cursor: pointer; font-family: inherit; }
  @media (prefers-color-scheme: dark) { button { color: #10231d; } }
  .copy { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 9px; font-size: .92rem; margin-top: 10px; }
  .big { border-radius: 10px; padding: 12px; margin-bottom: 8px; background: var(--accent-soft); }
  .big .k { font-size: .85rem; color: var(--sub); }
  .big .v { font-size: 1.05rem; font-weight: 700; }
  .big .s { font-size: .88rem; }
  .mail { white-space: pre-wrap; word-break: break-all; background: var(--input); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: .92rem; }
  .ng { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: .9rem; white-space: pre-wrap; }
  .note { font-size: .8rem; color: var(--sub); }
  [hidden] { display: none !important; }
  .mihon #sum .v, .mihon #sum .s, .mihon #say, .mihon #chat, .mihon #arrive, .mihon #ng { filter: blur(6px); user-select: none; }
</style>
</head>
<body>
<main>
  <h1>遅刻しそうな朝の連絡</h1>
  <p class="lead">電車の遅れや寝坊で、始業に間に合わないときの連絡を作ります。遅れる理由・着く見込み・連絡の手段を選ぶと、連絡の順番と、電話で言う一言、チャットやメールで送る文が出ます。入力した内容は、このページの外には送られません。</p>

  <div class="card">
    <h2>1. いまの状態</h2>
    <label class="f" for="why">遅れる理由<span class="hint">いちばん近いものを選ぶ</span></label>
    <select id="why">
      <option value="train">電車・バスの遅れ</option>
      <option value="sleep">寝坊した</option>
      <option value="body">体調が悪く、出るのが遅れる</option>
      <option value="home">家の用事（子どもの急な体調など）</option>
    </select>
    <label class="f" for="eta">着く見込み<span class="hint">わかれば時刻を入れる。わからなければ空のまま</span></label>
    <input type="text" id="eta" placeholder="例：9時30分">
    <label class="f" for="how">連絡の手段<span class="hint">職場でふだん使う方法</span></label>
    <select id="how">
      <option value="tel">電話</option>
      <option value="chat">チャット・メール</option>
    </select>
    <label class="f" for="when">連絡する時間</label>
    <select id="when">
      <option value="before">始業前に連絡できる</option>
      <option value="late">もう始業を過ぎている</option>
    </select>
    <h2 style="margin-top:20px">2. 今日の予定</h2>
    <label class="f" for="task">遅れると困る予定<span class="hint">なければ空のまま</span></label>
    <input type="text" id="task" placeholder="例：9時からの朝礼">
    <label class="f" for="boss">連絡する相手（上司）の名前</label>
    <input type="text" id="boss" placeholder="例：佐藤">
    <label class="f" for="me">自分の名前</label>
    <input type="text" id="me" placeholder="例：田中">
  </div>
  <button id="make" type="button">連絡を作る</button>

  <div class="card" id="result" hidden style="margin-top:16px">
    <h2>できあがり</h2>
    <div id="sum"></div>
    <h3>電話で言う一言</h3>
    <div class="mail" id="say"></div>
    <button type="button" class="copy" data-t="say">一言をコピー</button>
    <h3>チャット・メールで送る文</h3>
    <div class="mail" id="chat"></div>
    <button type="button" class="copy" data-t="chat">文をコピー</button>
    <h3>着いたときの一言</h3>
    <div class="mail" id="arrive"></div>
    <h3>避けたい言い方</h3>
    <div class="ng" id="ng"></div>
  </div>

  <p class="note">※連絡の仕方の目安です。遅刻の連絡先や手段、遅延証明書が要るかどうか、遅れた時間の扱いは、会社の就業規則（会社の決まり）もあわせて確かめてください。<br>
  最終更新：2026年10月　はじめての係</p>
</main>

<script>
(function () {
  var DEMO = location.search.indexOf("demo") >= 0;
  if (location.search.indexOf("mihon") >= 0) document.body.className = "mihon";
  function $(id) { return document.getElementById(id); }
  function v(id) { return $(id).value.trim(); }
  function make() {
    var why = $("why").value, how = $("how").value, when = $("when").value;
    var eta = v("eta"), task = v("task"), boss = v("boss"), me = v("me") || "（自分の名前）";
    var to = boss ? boss + "さん" : "（上司の名前）さん";
    var s = $("sum"); s.innerHTML = "";
    function card(k, val, sub) {
      var el = document.createElement("div"); el.className = "big";
      el.innerHTML = '<div class="k"></div><div class="v"></div><div class="s"></div>';
      el.querySelector(".k").textContent = k; el.querySelector(".v").textContent = val; el.querySelector(".s").textContent = sub;
      s.appendChild(el);
    }
    var W = { train: "電車が遅れていて", sleep: "寝坊してしまい", body: "体調がすぐれず、\n家を出るのが遅れていて", home: "家の急な用事で、\n家を出るのが遅れていて" }[why];
    var E = eta ? eta + "ごろに\n着く見込みです。" : "着く時間がわかったら、\nすぐにご連絡します。";
    if (when === "before") {
      card("連絡のタイミング", "遅れるとわかった時点で、始業の前に", "間に合うかもしれない、と待つより先に連絡します。結果として間に合ったら、それはそれで足ります。");
    } else {
      card("連絡のタイミング", "気づいた今すぐ、おわびを先に", "始業を過ぎていたら、最初に連絡が遅れたおわびを言います。言いわけは重ねません。");
    }
    card("伝える順番", "遅れる → 理由をひとこと → 着く時刻 → 今日の予定", "相手が知りたいのは、何時に来るかと、仕事をどうするかです。理由は一言で足ります。");
    card("次に連絡すること", eta ? "時刻がずれそうなら、その時点でもう一度" : "着く時刻がわかったら、すぐに", "最初の連絡で言った時刻より遅れそうなら、もう一度短く連絡します。");
    var sorry = why === "sleep" ? "寝坊してしまい、\n申し訳ありません。\n" : "";
    var late = when === "late" ? (why === "sleep" ? "寝坊して、ご連絡も\n遅くなってしまい、\n申し訳ありません。\n" : "ご連絡が遅くなり、\n申し訳ありません。\n") : "";
    if (when === "late" && why === "sleep") sorry = "";
    var W2 = why === "sleep" ? "" : W + "、\n";
    var t = task ? "\n" + task + "には\n間に合いそうにありません。\nお手数ですが、\nよろしくお願いします。\n" : "";
    var say = "おはようございます。\n" + me + "です。\n" + late + sorry + W2 + "始業に遅れてしまいます。\n" + E + "\n" + t + "ご迷惑をおかけして、\n申し訳ありません。";
    $("say").textContent = say;
    var chat = to + "\n\nおはようございます。" + me + "です。\n" + late + sorry + W2 + "本日、始業に\n遅れてしまいます。\n" + E + "\n" +
      (task ? "\n" + task + "には\n間に合いそうにありません。\n必要でしたら、\nどなたかにお願いできれば\n助かります。\n" : "") +
      (how === "tel" ? "\nお電話がつながらなかったため、\nこちらでご連絡しました。\n" : "") +
      "\nご迷惑をおかけして、\n申し訳ありません。\nよろしくお願いいたします。";
    $("chat").textContent = chat;
    var arrive = "遅れてしまい、\n申し訳ありませんでした。\n" + (task ? task + "のこと、\n対応いただき\nありがとうございました。\n" : "") + "このあと、すぐに\n取りかかります。";
    $("arrive").textContent = arrive;
    var ng = "・「すぐ着きます」と、時刻を言わない\n・間に合うかもと待って、連絡が始業のあとになる\n・同僚だけに伝えて、上司に言わない";
    if (why === "train") ng += "\n・遅延証明書が要るのに、もらわずに改札を出る";
    if (why === "sleep") ng += "\n・電車の遅れなど、ちがう理由を言う";
    if (how === "chat") ng += "\n・既読を見ないで、送ったきりにする";
    $("ng").textContent = ng;
    $("result").hidden = false;
  }
  [].forEach.call(document.querySelectorAll(".copy"), function (b) {
    b.addEventListener("click", function () {
      var txt = $(b.getAttribute("data-t")).textContent, label = b.textContent;
      var ok = function () { b.textContent = "コピーしました"; setTimeout(function () { b.textContent = label; }, 1500); };
      function fallback() {
        var ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta);
        ta.select(); try { document.execCommand("copy"); ok(); } catch (err) {} document.body.removeChild(ta);
      }
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(ok, fallback); else fallback();
    });
  });
  $("make").addEventListener("click", function () { make(); if (!DEMO) $("result").scrollIntoView({ behavior: "smooth" }); });
  if (DEMO) {
    $("why").value = "train"; $("eta").value = "9時30分"; $("how").value = "tel"; $("when").value = "before";
    $("task").value = "9時からの朝礼"; $("boss").value = "佐藤"; $("me").value = "田中";
    make();
  }
})();
</script>
</body>
</html>
