<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>仕事量の相談メモ｜はじめての係</title>
<style>
  :root {
    --bg: #faf8f5; --card: #ffffff; --text: #2b2b2b; --sub: #6b6b6b;
    --line: #e4dfd8; --accent: #2f6f5e; --accent-soft: #e6f0ec; --input: #fffbe8;
    --warn: #a4412f; --warn-soft: #f8e9e5; --mus: #c99a2e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --card: #26262a; --text: #ececec; --sub: #a5a5a5;
      --line: #3a3a3f; --accent: #7cc4ad; --accent-soft: #23372f; --input: #2e2c22;
      --warn: #f0a08f; --warn-soft: #3d2622; --mus: #e3c578;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", "Meiryo", sans-serif; line-height: 1.7; font-size: 16px; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 0 0 10px; }
  h3 { font-size: .98rem; margin: 18px 0 6px; }
  .lead { color: var(--sub); font-size: .9rem; margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  label.f { display: block; font-weight: 600; margin: 14px 0 6px; }
  .card > label.f:first-of-type { margin-top: 0; }
  .hint { font-weight: 400; color: var(--sub); font-size: .85rem; display: block; }
  input[type=text], input[type=number], input[type=date], select { width: 100%; font-size: 1rem; padding: 9px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--input); color: var(--text); font-family: inherit; }
  .row { display: flex; gap: 8px; } .row > div { flex: 1; min-width: 0; }
  .task { border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 10px; }
  .task:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
  .task label { display: block; font-size: .8rem; color: var(--sub); margin: 4px 0 3px; }
  .task .row > div:first-child { flex: 3; } .task .row > div:last-child { flex: 2; }
  button { width: 100%; font-size: 1rem; font-weight: 700; padding: 12px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; margin-top: 16px; cursor: pointer; font-family: inherit; }
  @media (prefers-color-scheme: dark) { button { color: #10231d; } }
  button.sub, .copy { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 9px; font-size: .92rem; margin-top: 10px; }
  .big { border-radius: 10px; padding: 12px; margin-bottom: 10px; background: var(--accent-soft); }
  .big.ng { background: var(--warn-soft); }
  .big .k { font-size: .85rem; color: var(--sub); }
  .big .v { font-size: 1.25rem; font-weight: 700; }
  .big.ng .v { color: var(--warn); }
  .big .s { font-size: .85rem; color: var(--sub); }
  .ln { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: .9rem; }
  .ln .ok { color: var(--accent); font-weight: 700; white-space: nowrap; }
  .ln .bad { color: var(--warn); font-weight: 700; white-space: nowrap; }
  .first { background: var(--input); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .mail { white-space: pre-wrap; background: var(--input); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: .92rem; }
  .note { font-size: .8rem; color: var(--sub); }
  [hidden] { display: none !important; }
  .mihon #first, .mihon #memo { filter: blur(6px); user-select: none; }
</style>
</head>
<body>
<main>
  <h1>仕事量の相談メモ</h1>
  <p class="lead">仕事が多すぎて回らないときに、上司に相談する前の準備をします。今かかえている仕事の締め切りと、残りにかかる時間を入れると、何時間足りないか、どれが間に合わないかがわかり、上司に見せる相談メモと、切り出しの一言ができます。入力した内容は、このページの外には送られません。</p>

  <div class="card">
    <h2>1. 今かかえている仕事</h2>
    <div id="tasks"></div>
    <button type="button" class="sub" id="add">仕事を追加する</button>
  </div>

  <div class="card">
    <h2>2. 使える時間</h2>
    <label class="f" for="hours">1日に、これらの仕事に使える時間<span class="hint">会議や電話、ほかの決まった作業の時間を引いた残り</span></label><input type="number" id="hours" min="1" max="12" step="0.5" value="5" inputmode="decimal">
    <label class="f" for="start">今日の日付</label><input type="date" id="start">
    <button id="make" type="button">足りない時間を出す</button>
  </div>

  <div class="card" id="result" hidden>
    <h2>結果</h2>
    <div id="sum"></div>
    <h3>締め切りの早い順</h3>
    <div id="lines"></div>
    <h3>切り出しの一言</h3>
    <div class="first" id="first"></div>
    <h3>上司に見せる相談メモ</h3>
    <div class="mail" id="memo"></div>
    <button type="button" class="copy" id="copy">相談メモをコピー</button>
  </div>

  <p class="note">※土日を除いた日数で計算した目安です。急な仕事や休みの予定は、使える時間を減らして入れてください。<br>
  最終更新：2026年10月　はじめての係</p>
</main>

<script>
(function () {
  var DEMO = location.search.indexOf("demo") >= 0;
  if (location.search.indexOf("mihon") >= 0) document.body.className = "mihon";
  function $(id) { return document.getElementById(id); }
  var WD = ["日", "月", "火", "水", "木", "金", "土"];
  function pd(s) { if (!s) return null; var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function md(d) { return (d.getMonth() + 1) + "/" + d.getDate() + "（" + WD[d.getDay()] + "）"; }
  function iso(d) { return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
  // 今日から締め切りの日まで（両方を含む）の、土日を除いた日数
  function bizDays(a, b) { var n = 0, x = new Date(a); while (x <= b) { if (x.getDay() !== 0 && x.getDay() !== 6) n++; x.setDate(x.getDate() + 1); } return n; }
  function addTask(name, due, h) {
    var d = document.createElement("div"); d.className = "task";
    d.innerHTML = '<label>仕事</label><input type="text" class="nm" placeholder="例：月末の請求書">' +
      '<div class="row"><div><label>締め切り</label><input type="date" class="due"></div><div><label>残り（時間）</label><input type="number" class="h" min="0" step="0.5" inputmode="decimal"></div></div>';
    d.querySelector(".nm").value = name || ""; d.querySelector(".due").value = due || ""; d.querySelector(".h").value = h || "";
    $("tasks").appendChild(d);
  }
  for (var i = 0; i < 3; i++) addTask();
  $("add").addEventListener("click", function () { addTask(); });
  $("start").value = iso(new Date());

  function make() {
    var start = pd($("start").value) || new Date(); start.setHours(0, 0, 0, 0);
    var per = +$("hours").value || 5;
    var ts = Array.prototype.map.call(document.querySelectorAll(".task"), function (el) {
      return { name: el.querySelector(".nm").value.trim(), due: pd(el.querySelector(".due").value), h: +el.querySelector(".h").value || 0 };
    }).filter(function (t) { return t.name && t.due && t.h > 0; });
    if (!ts.length) { alert("仕事の名前・締め切り・残りの時間を入れてください。"); return; }
    ts.sort(function (a, b) { return a.due - b.due; });
    var cum = 0, worst = 0, worstDue = null, lines = [], late = [];
    ts.forEach(function (t) {
      cum += t.h;
      var avail = Math.max(0, bizDays(start, t.due)) * per;
      var short = cum - avail;
      t.ok = short <= 0; t.short = short;
      if (!t.ok) late.push(t);
      if (short > worst) { worst = short; worstDue = t.due; }
    });
    var total = ts.reduce(function (s, t) { return s + t.h; }, 0);
    var sb = $("sum"); sb.innerHTML = "";
    var el = document.createElement("div"); el.className = "big" + (worst > 0 ? " ng" : "");
    el.innerHTML = '<div class="k"></div><div class="v"></div><div class="s"></div>';
    el.querySelector(".k").textContent = "このまま進めると";
    el.querySelector(".v").textContent = worst > 0 ? md(worstDue) + "までに、約" + Math.ceil(worst) + "時間足りません" : "今の時間で、すべて間に合う見込みです";
    el.querySelector(".s").textContent = "残りの仕事は合計" + total + "時間。1日" + per + "時間で計算（土日を除く）" + (worst > 0 ? "。1日あたり約" + (Math.round(worst / Math.max(1, bizDays(start, worstDue)) * 10) / 10) + "時間の残業にあたります" : "");
    sb.appendChild(el);
    var lb = $("lines"); lb.innerHTML = "";
    ts.forEach(function (t) {
      var d = document.createElement("div"); d.className = "ln";
      d.innerHTML = "<span></span><span></span>";
      d.children[0].textContent = md(t.due) + "　" + t.name + "（" + t.h + "時間）";
      d.children[1].textContent = t.ok ? "間に合う" : "約" + Math.ceil(t.short) + "時間足りない";
      d.children[1].className = t.ok ? "ok" : "bad";
      lb.appendChild(d);
    });
    $("first").textContent = worst > 0 ? "「〇〇さん、今週の仕事の進め方について、10分ほどご相談させてください。このままだと、" + md(late[0].due) + "締め切りの" + late[0].name + "が間に合わなそうです。」" :
      "「〇〇さん、今週の仕事の進め方について、5分ほど確認させてください。」";
    var memo = "【仕事の進め方のご相談】\n今かかえている仕事（締め切りの早い順）\n" +
      ts.map(function (t) { return "・" + md(t.due) + "　" + t.name + "　残り約" + t.h + "時間" + (t.ok ? "" : "　←間に合わない見込み"); }).join("\n") +
      "\n\n1日にこれらの仕事に使える時間は約" + per + "時間です。\n" +
      (worst > 0 ? "このままだと、" + md(worstDue) + "までに約" + Math.ceil(worst) + "時間足りません。\n\n【ご相談したいこと】\n次のどれにするか、決めていただけますか。\n" +
        "A．締め切りを延ばせるものがあるか（例：" + late[0].name + "）\n" +
        "B．ほかの方にお願いできるものがあるか\n" +
        "C．今回は、やらなくてよいもの・簡単にしてよいものがあるか" :
        "今のところ間に合う見込みですが、新しい仕事が入ると難しくなります。\n優先順位に間違いがないか、確認していただけますか。");
    $("memo").textContent = memo;
    $("result").hidden = false;
  }
  $("copy").addEventListener("click", function (e) {
    var b = e.target, txt = $("memo").textContent;
    var ok = function () { b.textContent = "コピーしました"; setTimeout(function () { b.textContent = "相談メモをコピー"; }, 1500); };
    function fallback() {
      var t = document.createElement("textarea"); t.value = txt; document.body.appendChild(t);
      t.select(); try { document.execCommand("copy"); ok(); } catch (err) {} document.body.removeChild(t);
    }
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(ok, fallback); else fallback();
  });
  $("make").addEventListener("click", function () { make(); if (!DEMO) $("result").scrollIntoView({ behavior: "smooth" }); });
  if (DEMO) {
    $("start").value = "2026-10-19"; $("hours").value = 3;
    var rows = document.querySelectorAll(".task");
    [["月末の請求書", "2026-10-23", 12], ["会議の資料づくり", "2026-10-22", 6], ["新人さんの研修の準備", "2026-10-27", 8]].forEach(function (x, i) {
      rows[i].querySelector(".nm").value = x[0]; rows[i].querySelector(".due").value = x[1]; rows[i].querySelector(".h").value = x[2];
    });
    addTask("取引先への提案書", "2026-10-26", 6);
    make();
  }
})();
</script>
</body>
</html>
