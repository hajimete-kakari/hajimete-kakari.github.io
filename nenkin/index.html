<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>退職後の国民年金の切り替え｜はじめての係</title>
<style>
  :root {
    --bg: #faf8f5; --card: #ffffff; --text: #2b2b2b; --sub: #6b6b6b;
    --line: #e4dfd8; --accent: #2f6f5e; --accent-soft: #e6f0ec; --input: #fffbe8;
    --warn: #a4412f; --warn-soft: #f8e9e5; --mus: #c99a2e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --card: #26262a; --text: #ececec; --sub: #a5a5a5;
      --line: #3a3a3f; --accent: #7cc4ad; --accent-soft: #23372f; --input: #2e2c22;
      --warn: #f0a08f; --warn-soft: #3d2622; --mus: #e3c578;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", "Meiryo", sans-serif; line-height: 1.7; font-size: 16px; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 0 0 10px; }
  h3 { font-size: .98rem; margin: 18px 0 6px; }
  .lead { color: var(--sub); font-size: .9rem; margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  label.f { display: block; font-weight: 600; margin: 14px 0 6px; }
  .card > label.f:first-of-type { margin-top: 0; }
  .hint { font-weight: 400; color: var(--sub); font-size: .85rem; display: block; }
  input[type=date], select { width: 100%; font-size: 1rem; padding: 9px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--input); color: var(--text); font-family: inherit; }
  .row { display: flex; gap: 8px; } .row > div { flex: 1; min-width: 0; }
  button { width: 100%; font-size: 1rem; font-weight: 700; padding: 12px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; margin-top: 18px; cursor: pointer; font-family: inherit; }
  @media (prefers-color-scheme: dark) { button { color: #10231d; } }
  .copy { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 9px; font-size: .92rem; margin-top: 10px; }
  .big { border-radius: 10px; padding: 12px; margin-bottom: 8px; background: var(--accent-soft); }
  .big.ng { background: var(--warn-soft); }
  .big .k { font-size: .85rem; color: var(--sub); }
  .big .v { font-size: 1.1rem; font-weight: 700; }
  .big.ng .v { color: var(--warn); }
  .big .s { font-size: .88rem; }
  .ln { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: .9rem; }
  .ln b { white-space: nowrap; text-align: right; }
  .box { white-space: pre-wrap; background: var(--input); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: .92rem; }
  .note { font-size: .8rem; color: var(--sub); }
  [hidden] { display: none !important; }
  .mihon #sum .k, .mihon #sum .v, .mihon #sum .s, .mihon #dates b, .mihon #bring, .mihon #memo { filter: blur(6px); user-select: none; }
</style>
</head>
<body>
<main>
  <h1>退職後の国民年金の切り替え</h1>
  <p class="lead">会社を辞めたあと、厚生年金から国民年金に切り替える手続きが要るかどうかと、その期限・持っていくもの・家族の手続きを確かめます。入力した内容は、このページの外には送られません。</p>

  <div class="card">
    <h2>1. 日付と年齢</h2>
    <div class="row">
      <div><label class="f" for="quit">退職日</label><input type="date" id="quit"></div>
      <div><label class="f" for="join">次の会社に入る日<span class="hint">未定なら空欄</span></label><input type="date" id="join"></div>
    </div>
    <label class="f" for="age">退職日の時点の自分の年齢</label>
    <select id="age"><option value="u60">20歳〜59歳</option><option value="o60">60歳以上</option></select>
  </div>

  <div class="card">
    <h2>2. 家族と支払い</h2>
    <label class="f" for="sp">扶養している配偶者</label>
    <select id="sp">
      <option value="none">いない</option>
      <option value="u60">いる（20歳〜59歳）</option>
      <option value="o60">いる（60歳以上）</option>
    </select>
    <label class="f" for="hard">保険料の支払い</label>
    <select id="hard"><option value="ok">払えそう</option><option value="hard">しばらく苦しい</option></select>
    <button id="make" type="button">確かめる</button>
  </div>

  <div class="card" id="result" hidden>
    <h2>結果</h2>
    <div id="sum"></div>
    <h3>日付</h3>
    <div id="dates"></div>
    <h3>市区町村の窓口に持っていくもの</h3>
    <div class="box" id="bring"></div>
    <h3>窓口で言うこと</h3>
    <div class="box" id="memo"></div>
    <button type="button" class="copy" id="copy">言うことをコピー</button>
  </div>

  <p class="note">※国民年金の一般的な決まりをもとにした目安です。持っていくものや、マイナンバーカードで済むかどうかは、市区町村によって違います。国民年金の保険料は、年度ごとに見直されます。<br>
  最終更新：2026年10月　はじめての係</p>
</main>

<script>
(function () {
  var DEMO = location.search.indexOf("demo") >= 0;
  if (location.search.indexOf("mihon") >= 0) document.body.className = "mihon";
  function $(id) { return document.getElementById(id); }
  var WD = ["日", "月", "火", "水", "木", "金", "土"];
  function pd(s) { if (!s) return null; var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function md(d) { return (d.getMonth() + 1) + "/" + d.getDate() + "（" + WD[d.getDay()] + "）"; }
  function add(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  var MEMO = "";
  function make() {
    var quit = pd($("quit").value), join = pd($("join").value);
    if (!quit) { alert("退職日を入れてください。"); return; }
    var age = $("age").value, sp = $("sp").value, hard = $("hard").value;
    var lose = add(quit, 1), due = add(lose, 13);
    // 国民年金になる月数：厚生年金をやめた日の月から、次の会社に入る月の前の月まで（月末の状態で数える）
    var months = null;
    if (join) months = Math.max(0, (join.getFullYear() * 12 + join.getMonth()) - (lose.getFullYear() * 12 + lose.getMonth()));
    var spNeed = sp === "u60";
    var selfNeed = age === "u60";
    var sb = $("sum"); sb.innerHTML = "";
    var el = document.createElement("div");
    el.innerHTML = '<div class="k"></div><div class="v"></div><div class="s"></div>';
    var v, s, ng = false;
    if (!selfNeed && !spNeed) { v = "切り替えの手続きは、要らない見込み"; s = "60歳以上は、国民年金に入る義務がありません（年金を増やしたい人は、任意で入る道があります）。"; }
    else if (months === 0) { v = "保険料はかからない見込み"; s = "同じ月のうちに次の会社に入るので、その月は次の会社の厚生年金として数えます。間の日の手続きが要るかは、市区町村に確かめてください。"; }
    else { ng = true; v = md(due) + "までに、市区町村で切り替え"; s = (selfNeed ? "自分" : "") + (selfNeed && spNeed ? "と" : "") + (spNeed ? "配偶者" : "") + "の国民年金への切り替えが要ります。" + (months ? "国民年金になるのは、約" + months + "か月分です。" : "次の会社に入るまで、毎月の保険料がかかります。") + (hard === "hard" ? "払うのが苦しいときは、同じ窓口で、失業による免除を相談できます。" : ""); }
    el.className = "big" + (ng ? " ng" : "");
    el.querySelector(".k").textContent = "あなたの場合";
    el.querySelector(".v").textContent = v; el.querySelector(".s").textContent = s;
    sb.appendChild(el);
    var db = $("dates"); db.innerHTML = "";
    function line(a, b) { var d = document.createElement("div"); d.className = "ln"; d.innerHTML = "<span></span><b></b>"; d.children[0].textContent = a; d.children[1].textContent = b; db.appendChild(d); }
    line("退職日", md(quit));
    line("厚生年金をやめた日", md(lose));
    line("切り替えの期限", md(due) + "まで（14日以内）");
    if (join) line("次の会社に入る日", md(join));
    line("最初の納付書が届く", "手続きから1〜2か月後が多い");
    var b = ["・基礎年金番号がわかるもの（年金手帳・基礎年金番号通知書など）。マイナンバーカードで足りることもある",
      "・退職日がわかる書類（離職票・退職証明書・健康保険の資格喪失証明書など）",
      "・本人確認の書類"];
    if (spNeed) b.push("・配偶者の基礎年金番号がわかるもの（配偶者の分も一緒に手続きする）");
    if (hard === "hard") b.push("・免除を相談するなら：離職票か雇用保険受給資格者証のコピー");
    $("bring").textContent = (selfNeed || spNeed) ? b.join("\n") : "手続きは要らない見込みです。";
    MEMO = (selfNeed || spNeed) ? "「" + md(quit) + "に会社を辞めました。厚生年金から国民年金への切り替えをお願いします。" + (spNeed ? "扶養していた配偶者の分も、お願いします。" : "") + (hard === "hard" ? "保険料を払うのが苦しいので、失業による免除も相談させてください。" : "") + (join ? "次の会社には" + md(join) + "から入る予定です。" : "") + "」" : "（手続きは要らない見込みです）";
    $("memo").textContent = MEMO;
    $("result").hidden = false;
  }
  $("copy").addEventListener("click", function (e) {
    var b = e.target, txt = MEMO.replace(/^「|」$/g, "");
    var ok = function () { b.textContent = "コピーしました"; setTimeout(function () { b.textContent = "言うことをコピー"; }, 1500); };
    function fallback() {
      var t = document.createElement("textarea"); t.value = txt; document.body.appendChild(t);
      t.select(); try { document.execCommand("copy"); ok(); } catch (err) {} document.body.removeChild(t);
    }
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(ok, fallback); else fallback();
  });
  $("make").addEventListener("click", function () { make(); if (!DEMO) $("result").scrollIntoView({ behavior: "smooth" }); });
  if (DEMO) {
    $("quit").value = "2026-11-30"; $("join").value = "2027-03-01"; $("sp").value = "u60"; $("hard").value = "hard";
    make();
  }
})();
</script>
</body>
</html>
