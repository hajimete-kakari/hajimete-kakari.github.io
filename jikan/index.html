<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>上司に時間をもらう声のかけ方｜はじめての係</title>
<style>
  :root {
    --bg: #faf8f5; --card: #ffffff; --text: #2b2b2b; --sub: #6b6b6b;
    --line: #e4dfd8; --accent: #2f6f5e; --accent-soft: #e6f0ec; --input: #fffbe8;
    --warn: #a4412f; --warn-soft: #f8e9e5; --mus: #c99a2e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --card: #26262a; --text: #ececec; --sub: #a5a5a5;
      --line: #3a3a3f; --accent: #7cc4ad; --accent-soft: #23372f; --input: #2e2c22;
      --warn: #f0a08f; --warn-soft: #3d2622; --mus: #e3c578;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", "Meiryo", sans-serif; line-height: 1.7; font-size: 16px; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 0 0 10px; }
  h3 { font-size: .98rem; margin: 18px 0 6px; }
  .lead { color: var(--sub); font-size: .9rem; margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  label.f { display: block; font-weight: 600; margin: 14px 0 6px; }
  .card > label.f:first-of-type { margin-top: 0; }
  .hint { font-weight: 400; color: var(--sub); font-size: .85rem; display: block; }
  input[type=text], select { width: 100%; font-size: 1rem; padding: 9px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--input); color: var(--text); font-family: inherit; }
  button { width: 100%; font-size: 1rem; font-weight: 700; padding: 12px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; margin-top: 18px; cursor: pointer; font-family: inherit; }
  @media (prefers-color-scheme: dark) { button { color: #10231d; } }
  .copy { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 9px; font-size: .92rem; margin-top: 10px; }
  .big { border-radius: 10px; padding: 12px; margin-bottom: 8px; background: var(--accent-soft); }
  .big .k { font-size: .85rem; color: var(--sub); }
  .big .v { font-size: 1.05rem; font-weight: 700; }
  .big .s { font-size: .88rem; }
  .mail { white-space: pre-wrap; background: var(--input); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: .92rem; }
  .ng { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: .9rem; white-space: pre-wrap; }
  .note { font-size: .8rem; color: var(--sub); }
  [hidden] { display: none !important; }
  .mihon #sum .v, .mihon #sum .s, .mihon #msg, .mihon #ask, .mihon #ng { filter: blur(6px); user-select: none; }
</style>
</head>
<body>
<main>
  <h1>上司に時間をもらう声のかけ方</h1>
  <p class="lead">上司に「少しお時間いただけますか」と切り出すときの、最初の一言を作ります。話の種類とかかる時間、いつまでに話したいかを入れると、声をかける時間帯の目安と、口頭・チャットでそのまま使える一言が出ます。入力した内容は、このページの外には送られません。</p>

  <div class="card">
    <h2>1. 話したいこと</h2>
    <label class="f" for="kind">話の種類<span class="hint">中身は、声をかける時点では言わなくてかまいません</span></label>
    <select id="kind">
      <option value="quit">辞めることの相談</option>
      <option value="move">異動や働き方（時短・勤務地など）の相談</option>
      <option value="life">体調や家庭の事情の相談</option>
      <option value="work">仕事の量や進め方の相談</option>
      <option value="miss">ミスやトラブルの報告</option>
    </select>
    <label class="f" for="min">かかりそうな時間</label>
    <select id="min">
      <option value="5">5分ほど</option>
      <option value="15">15分ほど</option>
      <option value="30">30分ほど</option>
    </select>
    <label class="f" for="when">いつまでに話したいか</label>
    <select id="when">
      <option value="today">今日中</option>
      <option value="week">今週中</option>
      <option value="later">急がない（来週以降でもよい）</option>
    </select>
    <h2 style="margin-top:20px">2. 相手と場面</h2>
    <label class="f" for="nm">上司の呼び方<span class="hint">ふだん呼んでいる形で</span></label>
    <input type="text" id="nm" placeholder="例：山田課長">
    <label class="f" for="place">話す場所</label>
    <select id="place">
      <option value="room">ほかの人に聞かれない場所がいい</option>
      <option value="desk">席でもかまわない</option>
    </select>
    <label class="f" for="how">伝え方</label>
    <select id="how">
      <option value="talk">口頭（席で・通りがかりに）</option>
      <option value="chat">チャット・メール</option>
    </select>
  </div>
  <button id="make" type="button">一言を作る</button>

  <div class="card" id="result" hidden style="margin-top:16px">
    <h2>できあがり</h2>
    <div id="sum"></div>
    <h3>そのまま言える一言</h3>
    <div class="mail" id="msg"></div>
    <button type="button" class="copy" data-t="msg">一言をコピー</button>
    <h3>「何の話？」と聞かれたら</h3>
    <div class="mail" id="ask"></div>
    <h3>避けたい言い方</h3>
    <div class="ng" id="ng"></div>
  </div>

  <p class="note">※声のかけ方の目安です。職場で決まっている相談の窓口や面談の申し込み方があれば、そちらに合わせてください。<br>
  最終更新：2026年10月　はじめての係</p>
</main>

<script>
(function () {
  var DEMO = location.search.indexOf("demo") >= 0;
  if (location.search.indexOf("mihon") >= 0) document.body.className = "mihon";
  function $(id) { return document.getElementById(id); }
  function v(id) { return $(id).value.trim(); }
  var WORD = { quit: "今後のことで、ご相談", move: "働き方のことで、ご相談", life: "個人的なことで、ご相談", work: "仕事の進め方のことで、ご相談" };
  var ANS = {
    quit: "自分の今後のことです。\nここでは少し話しにくいので、\nお時間をいただけると助かります。",
    move: "働き方のことで、\n相談に乗っていただきたくて。\n詳しくはそのときにお話しします。",
    life: "体調（家のこと）で、\nお伝えしておきたいことがあります。\n少し込み入っているので、そのときに。",
    work: "いま持っている仕事の量と\n順番のことです。\n一覧を持っていきます。",
    miss: "（聞かれる前に、その場で）\n〇〇の件で、ミスがありました。\nいまわかっていることを先にお伝えします。"
  };
  var WHEN = {
    today: "朝のうち、上司が席に着いて落ち着いたころ。会議の直前・直後は避けます。",
    week: "週の前半の朝か、昼休みが終わって少したったころ。月末や締め日の前は避けます。",
    later: "今週のうちに声だけかけて、日時は上司に決めてもらいます。"
  };
  function make() {
    var n = v("nm") || "（上司の呼び方）";
    var kind = $("kind").value, min = $("min").value, when = $("when").value;
    var room = $("place").value === "room", chat = $("how").value === "chat";
    var miss = kind === "miss";
    var s = $("sum"); s.innerHTML = "";
    function card(k, val, sub) {
      var el = document.createElement("div"); el.className = "big";
      el.innerHTML = '<div class="k"></div><div class="v"></div><div class="s"></div>';
      el.querySelector(".k").textContent = k; el.querySelector(".v").textContent = val; el.querySelector(".s").textContent = sub;
      s.appendChild(el);
    }
    if (miss) {
      card("一言の組み立て", "急ぎだと言う → 1分だけもらう → すぐ報告", "ミスやトラブルは、時間を予約せずに、気づいたその場で声をかけます。待つほど、できる手当てが少なくなるためです。");
      card("声をかける時間帯", "いますぐ", "上司が会議中なら、チャットで「急ぎでご報告があります。会議のあと1分ください」と先に送っておきます。");
    } else {
      card("一言の組み立て", "相手の都合を聞く → 相談の大きさ → かかる時間 → " + (room ? "場所" : "日時") + "は上司に決めてもらう",
        "声をかける時点では、中身は言わなくてかまいません。「ご相談」か「ご報告」か、かかる時間だけを伝えると、上司も予定を組みやすくなります。" + (kind === "quit" ? "「辞めたい」を立ち話で言うと、その場で話が始まってしまうことが多いので、ここでは「今後のこと」にとどめます。" : ""));
      card("声をかける時間帯", when === "today" ? "今日の朝のうち" : (when === "week" ? "週の前半" : "今週のうちに、声だけ"), WHEN[when]);
    }
    var t = min + "分ほど";
    var msg;
    if (miss) {
      msg = chat
        ? n + "\nお疲れさまです。\n急ぎでご報告があります。\nいま1分だけ、お時間よろしいでしょうか。\nお席にうかがいます。"
        : n + "、すみません。\n急ぎでご報告があります。\nいま1分だけ、よろしいですか。";
    } else if (chat) {
      msg = n + "\nお疲れさまです。\n" + WORD[kind] + "したいことがあります。\n" + t + "、お時間をいただけないでしょうか。\n" +
        (room ? "できれば会議室など、二人で話せる場所だと助かります。\n" : "") +
        (when === "today" ? "急で申し訳ないのですが、今日のどこかでお願いできればと思います。" : (when === "week" ? "今週のご都合のよいときで、かまいません。" : "急ぎではないので、ご都合のよい日を教えてください。"));
    } else {
      msg = n + "、いまよろしいですか。\n" + WORD[kind] + "したいことがありまして、\n" + t + "、お時間をいただけますか。\n" +
        (room ? "できれば、少し場所を変えて\nお話しできると助かります。\n" : "") +
        (when === "today" ? "今日のどこかで、ご都合いかがでしょう。" : "ご都合のよいときを、教えていただけますか。");
    }
    $("msg").textContent = msg;
    $("ask").textContent = ANS[kind] + (miss ? "" : "\n\n（「いま聞くよ」と言われたら）\n" + (room ? "ありがとうございます。\nできれば、少し場所を変えても\nよろしいですか。" : "ありがとうございます。\nでは、手短にお話しします。"));
    var ng = "・「ちょっといいですか」だけで、" + (miss ? "急ぎかどうかを言わない" : "時間も話の大きさも言わない") + "\n" +
      (miss ? "・ミスの中身を、ほかの人の前で大きな声で話しはじめる" : "・忙しそうな場面で、ほかの人の前で声をかける") + "\n・「大したことじゃないんですけど」と小さく言いすぎる";
    if (kind === "quit") ng += "\n・声をかける時点で「辞めたいんです」と言ってしまう";
    if (miss) ng += "\n・「あとでお時間ください」と、報告を先にのばす";
    else ng += "\n・夕方の帰りぎわや、締め日の忙しい時間に切り出す";
    $("ng").textContent = ng;
    $("result").hidden = false;
  }
  [].forEach.call(document.querySelectorAll(".copy"), function (b) {
    b.addEventListener("click", function () {
      var txt = $(b.getAttribute("data-t")).textContent, label = b.textContent;
      var ok = function () { b.textContent = "コピーしました"; setTimeout(function () { b.textContent = label; }, 1500); };
      function fallback() {
        var ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta);
        ta.select(); try { document.execCommand("copy"); ok(); } catch (err) {} document.body.removeChild(ta);
      }
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(ok, fallback); else fallback();
    });
  });
  $("make").addEventListener("click", function () { make(); if (!DEMO) $("result").scrollIntoView({ behavior: "smooth" }); });
  if (DEMO) { $("nm").value = "山田課長"; $("kind").value = "quit"; $("min").value = "15"; $("when").value = "week"; make(); }
})();
</script>
</body>
</html>
