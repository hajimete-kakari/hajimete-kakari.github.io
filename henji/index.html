<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>2回目のメール作成ページ｜はじめての係</title>
<style>
  :root {
    --bg: #faf8f5; --card: #ffffff; --text: #2b2b2b; --sub: #6b6b6b;
    --line: #e4dfd8; --accent: #2f6f5e; --accent-soft: #e6f0ec; --input: #fffbe8;
    --warn: #a4412f; --warn-soft: #f8e9e5; --mus: #c99a2e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --card: #26262a; --text: #ececec; --sub: #a5a5a5;
      --line: #3a3a3f; --accent: #7cc4ad; --accent-soft: #23372f; --input: #2e2c22;
      --warn: #f0a08f; --warn-soft: #3d2622; --mus: #e3c578;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", "Meiryo", sans-serif; line-height: 1.7; font-size: 16px; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 0 0 10px; }
  h3 { font-size: .98rem; margin: 16px 0 6px; }
  .lead { color: var(--sub); font-size: .9rem; margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  label.f { display: block; font-weight: 600; margin: 14px 0 6px; }
  .card > label.f:first-of-type { margin-top: 0; }
  .hint { font-weight: 400; color: var(--sub); font-size: .85rem; display: block; }
  input[type=text], input[type=date], select { width: 100%; font-size: 1rem; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--input); color: var(--text); font-family: inherit; }
  .row { display: flex; gap: 8px; } .row > div { flex: 1; min-width: 0; }
  button { width: 100%; font-size: 1rem; font-weight: 700; padding: 12px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; margin-top: 18px; cursor: pointer; font-family: inherit; }
  @media (prefers-color-scheme: dark) { button { color: #10231d; } }
  .copy { margin-top: 8px; padding: 9px; font-size: .92rem; background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .big { background: var(--accent-soft); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .big .k { font-size: .85rem; color: var(--sub); }
  .big .v { font-size: 1.15rem; font-weight: 700; }
  .big .s { font-size: .85rem; color: var(--sub); }
  .big.wait { background: var(--warn-soft); }
  .big.wait .v { color: var(--warn); }
  .mail { white-space: pre-wrap; background: var(--input); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: .92rem; }
  .q { border-left: 4px solid var(--accent); padding: 4px 0 6px 12px; margin-bottom: 10px; }
  .q .nm { font-weight: 700; }
  .q .w { font-size: .88rem; color: var(--sub); }
  .note { font-size: .8rem; color: var(--sub); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>2回目のメール作成ページ</h1>
  <p class="lead">返事が来ない相手に送る「2回目のメール」を作ります。相手と用件、聞きたいこと、期限を入れると、催促に見えず、1行で返してもらいやすい件名と本文ができます。入力した内容は、このページの外には送られません。</p>

  <div class="card">
    <h2>1. 相手と、1回目のメール</h2>
    <label class="f" for="aite">相手</label>
    <select id="aite">
      <option value="gai">社外の人（取引先・お客さん）</option>
      <option value="ue">社内の目上の人（上司・他部署の上の人）</option>
      <option value="nai">社内の同僚・後輩</option>
    </select>
    <div class="row">
      <div><label class="f" for="name">相手の名前</label><input type="text" id="name" placeholder="例：佐藤"></div>
      <div><label class="f" for="me">自分の名前<span class="hint">社外なら会社名も</span></label><input type="text" id="me" placeholder="例：〇〇商事の田中"></div>
    </div>
    <div class="row">
      <div><label class="f" for="first">1回目を送った日</label><input type="date" id="first"></div>
      <div><label class="f" for="youken">用件（件名に入れる短い言葉）</label><input type="text" id="youken" placeholder="例：見積もり"></div>
    </div>
  </div>

  <div class="card">
    <h2>2. 聞きたいことと、期限</h2>
    <label class="f" for="kata">相手に答えてほしい形</label>
    <select id="kata">
      <option value="ab">AとBのどちらか</option>
      <option value="yn">はい・いいえ</option>
      <option value="day">日付・日時</option>
      <option value="free">ひと言（その他）</option>
    </select>
    <label class="f" for="q">決めてほしいこと<span class="hint">1つだけ</span></label>
    <input type="text" id="q" placeholder="例：どちらのプランで進めるか">
    <div class="row" id="bxAB">
      <div><label class="f" for="a">A</label><input type="text" id="a" placeholder="例：月額プラン"></div>
      <div><label class="f" for="b">B</label><input type="text" id="b" placeholder="例：年額プラン"></div>
    </div>
    <div class="row">
      <div><label class="f" for="kigen">返事がほしい日</label><input type="date" id="kigen"></div>
      <div><label class="f" for="riyu">その日までにほしい理由</label><input type="text" id="riyu" placeholder="例：社内で決めるため"></div>
    </div>
    <button id="make" type="button">2回目のメールを作る</button>
  </div>

  <div class="card" id="result" hidden>
    <h2>できあがり</h2>
    <div id="judge"></div>
    <h3>件名</h3>
    <div class="mail" id="subj"></div>
    <button type="button" class="copy" id="copyS">件名をコピー</button>
    <h3>本文</h3>
    <div class="mail" id="body"></div>
    <button type="button" class="copy" id="copyB">本文をコピー</button>
    <h3>送る前に確かめること</h3>
    <div id="qs"></div>
  </div>

  <p class="note">※このページは文面を作るだけです。送る前に、名前・日付・用件が合っているかを読み直してください。<br>
  最終更新：2026年10月　はじめての係</p>
</main>

<script>
(function () {
  var DEMO = location.search.indexOf("demo") >= 0;
  function $(id) { return document.getElementById(id); }
  function v(id) { return $(id).value.trim(); }
  var WD = ["日", "月", "火", "水", "木", "金", "土"];
  function pd(s) { if (!s) return null; var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function md(d) { return (d.getMonth() + 1) + "月" + d.getDate() + "日（" + WD[d.getDay()] + "）"; }
  // 土日を除いた日数
  function bizDays(a, b) {
    var n = 0, x = new Date(a);
    while (x < b) { x.setDate(x.getDate() + 1); if (x.getDay() !== 0 && x.getDay() !== 6) n++; }
    return n;
  }
  function toggle() { $("bxAB").hidden = $("kata").value !== "ab"; }
  $("kata").addEventListener("change", toggle);

  function make() {
    var aite = $("aite").value, name = v("name") || "〇〇", me = v("me") || "〇〇", youken = v("youken") || "〇〇";
    var kata = $("kata").value, q = v("q") || "〇〇", A = v("a") || "A案", B = v("b") || "B案";
    var first = pd(v("first")), kigen = pd(v("kigen")), riyu = v("riyu");
    var today = DEMO ? new Date(2026, 9, 15) : new Date(); today.setHours(0, 0, 0, 0);

    // 送ってよいかの目安
    var j = $("judge"); j.innerHTML = "";
    if (first) {
      var days = bizDays(first, today);
      var cls = "big", head, sub;
      if (days < 2) { cls += " wait"; head = "まだ " + days + " 営業日。もう1日待つのがおすすめ"; sub = "社外の人は、2〜3営業日（土日を除いた日数）で返すことが多いです。急ぎでなければ、もう少し待ちます。急ぐ場合は、このまま送っても大丈夫です。"; }
      else if (days <= 7) { head = days + " 営業日たっています。送ってよい時期です"; sub = "2回目は「催促」ではなく「確認」として送ります。"; }
      else { cls += " wait"; head = days + " 営業日たっています。メールより電話も考えて"; sub = "1週間以上たっていると、メールが埋もれていることも。2回目を送ったうえで、翌日になっても返事がなければ電話にします。"; }
      var el = document.createElement("div"); el.className = cls;
      el.innerHTML = '<div class="v"></div><div class="s"></div>';
      el.querySelector(".v").textContent = head; el.querySelector(".s").textContent = sub;
      j.appendChild(el);
    }

    var sama = aite === "nai" ? name + "さん" : name + (aite === "ue" ? "さん" : "様");
    var firstTxt = first ? md(first) : "先日";
    var ask, answer;
    if (kata === "ab") { ask = q + "について、\nA：" + A + "\nB：" + B + "\nのどちらがよろしいでしょうか。"; answer = "「A」か「B」の\nひと言で結構です。"; }
    else if (kata === "yn") { ask = q + "について、\nこのまま進めて\nよろしいでしょうか。"; answer = "「はい」か「いいえ」の\nひと言で結構です。"; }
    else if (kata === "day") { ask = q + "について、\nご都合のよい日時を\n教えていただけますか。"; answer = "日付だけで結構です。"; }
    else { ask = q + "について、\n教えていただけますか。"; answer = "ひと言で結構です。"; }
    var kigenTxt = kigen ? md(kigen) : "";
    var due = kigen ? (riyu ? riyu + "、\n" : "") + kigenTxt + "までに\nお知らせいただけますと\n助かります。" : "";

    var subj, body;
    if (aite === "nai") {
      subj = "（確認）" + youken + "の件";
      body = sama + "\n" + firstTxt + "に送った" + youken + "の件、\n" + ask.replace("よろしいでしょうか", "いいですか").replace("教えていただけますか", "教えてもらえますか") + "\n" + answer.replace("結構です", "大丈夫です") +
        (kigen ? "\n" + (riyu ? riyu + "、\n" : "") + kigenTxt + "までに\nもらえると助かります。" : "");
    } else {
      subj = "（ご確認）" + youken + "の件";
      body = sama + "\n\n" + (aite === "gai" ? "お世話になっております。\n" : "お疲れさまです。\n") + me + "です。\n" +
        "行き違いでしたら\nご容赦ください。\n\n" +
        firstTxt + "にお送りした\n" + youken + "の件について、\n1点だけ確認させて\nください。\n\n" +
        ask + "\n" + answer + (due ? "\n\n" + due : "") + "\n\nよろしくお願いいたします。";
    }
    $("subj").textContent = subj;
    $("body").textContent = body;

    var qs = [
      ["名前・日付・用件は合っているか", "とくに相手の名前の字。間違えると、内容よりそちらが気になってしまいます"],
      ["1回目のメールを、下に付けたか", "返信の形で送れば、1回目が下に付きます。本文の上には、もう一度書きません"],
      ["聞いていることは1つだけか", "ほかにも聞きたいことは、返事が来てから聞けば間に合います"]
    ];
    if (aite !== "nai") qs.push(["上司をCCに入れていないか", "CC（写しとして宛先に加えること）は、3回目まで取っておきます。2回目から入れると、責めているように受け取られやすいからです"]);
    var qb = $("qs"); qb.innerHTML = "";
    qs.forEach(function (x) {
      var d = document.createElement("div"); d.className = "q";
      d.innerHTML = '<div class="nm"></div><div class="w"></div>';
      d.querySelector(".nm").textContent = x[0]; d.querySelector(".w").textContent = x[1];
      qb.appendChild(d);
    });
    $("result").hidden = false;
  }
  function copy(id, b, label) {
    var txt = $(id).textContent;
    var ok = function () { b.textContent = "コピーしました"; setTimeout(function () { b.textContent = label; }, 1500); };
    function fallback() {
      var t = document.createElement("textarea"); t.value = txt; document.body.appendChild(t);
      t.select(); try { document.execCommand("copy"); ok(); } catch (e) {} document.body.removeChild(t);
    }
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(ok, fallback); else fallback();
  }
  $("copyS").addEventListener("click", function (e) { copy("subj", e.target, "件名をコピー"); });
  $("copyB").addEventListener("click", function (e) { copy("body", e.target, "本文をコピー"); });
  $("make").addEventListener("click", function () { make(); if (!DEMO) $("result").scrollIntoView({ behavior: "smooth" }); });
  if (DEMO) {
    $("name").value = "佐藤"; $("me").value = "〇〇商事の田中"; $("first").value = "2026-10-12"; $("youken").value = "お見積もり";
    $("q").value = "ご契約のプラン"; $("a").value = "月額プラン"; $("b").value = "年額プラン";
    $("kigen").value = "2026-10-20"; $("riyu").value = "社内で21日に決めるため";
    make();
  }
})();
</script>
</body>
</html>
