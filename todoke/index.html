<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>退職届・退職願の作成ページ｜はじめての係</title>
<style>
  :root {
    --bg: #faf8f5; --card: #ffffff; --text: #2b2b2b; --sub: #6b6b6b;
    --line: #e4dfd8; --accent: #2f6f5e; --accent-soft: #e6f0ec; --input: #fffbe8;
    --warn: #a4412f; --warn-soft: #f8e9e5; --mus: #c99a2e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --card: #26262a; --text: #ececec; --sub: #a5a5a5;
      --line: #3a3a3f; --accent: #7cc4ad; --accent-soft: #23372f; --input: #2e2c22;
      --warn: #f0a08f; --warn-soft: #3d2622; --mus: #e3c578;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", "Meiryo", sans-serif; line-height: 1.7; font-size: 16px; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 0 0 10px; }
  h3 { font-size: .98rem; margin: 18px 0 6px; }
  .lead { color: var(--sub); font-size: .9rem; margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  label.f { display: block; font-weight: 600; margin: 14px 0 6px; }
  .card > label.f:first-of-type { margin-top: 0; }
  .hint { font-weight: 400; color: var(--sub); font-size: .85rem; display: block; }
  input[type=date], input[type=text], select { width: 100%; font-size: 1rem; padding: 9px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--input); color: var(--text); font-family: inherit; }
  .row { display: flex; gap: 8px; } .row > div { flex: 1; min-width: 0; }
  button { width: 100%; font-size: 1rem; font-weight: 700; padding: 12px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; margin-top: 18px; cursor: pointer; font-family: inherit; }
  @media (prefers-color-scheme: dark) { button { color: #10231d; } }
  .copy { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 9px; font-size: .92rem; margin-top: 10px; }
  .big { border-radius: 10px; padding: 12px; margin-bottom: 8px; background: var(--accent-soft); }
  .big.ng { background: var(--warn-soft); }
  .big .k { font-size: .85rem; color: var(--sub); }
  .big .v { font-size: 1.1rem; font-weight: 700; }
  .big.ng .v { color: var(--warn); }
  .big .s { font-size: .88rem; }
  .paper-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  @media (prefers-color-scheme: dark) { .paper-wrap { background: #f4f1ea; } }
  .paper { writing-mode: vertical-rl; color: #222; height: 420px; padding: 16px; font-size: .95rem; line-height: 2; white-space: pre-wrap; font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; }
  .box { white-space: pre-wrap; background: var(--input); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: .92rem; }
  .note { font-size: .8rem; color: var(--sub); }
  [hidden] { display: none !important; }
  .mihon #sum .k, .mihon #sum .v, .mihon #sum .s, .mihon .paper, .mihon #how { filter: blur(6px); user-select: none; }
</style>
</head>
<body>
<main>
  <h1>退職届・退職願の作成ページ</h1>
  <p class="lead">会社に出す退職届（または退職願）の文面を作ります。今の段階と退職日、辞める理由を選ぶと、どちらを出すか、縦書きの見本、出し方と出す時期が出ます。入力した内容は、このページの外には送られません。</p>

  <div class="card">
    <h2>1. 今の段階と日付</h2>
    <label class="f" for="stage">今の段階</label>
    <select id="stage">
      <option value="agreed">上司と話して、退職日が決まった</option>
      <option value="before">これから上司に伝える</option>
    </select>
    <div class="row">
      <div><label class="f" for="quit">退職日</label><input type="date" id="quit"></div>
      <div><label class="f" for="sub">出す日</label><input type="date" id="sub"></div>
    </div>
    <label class="f" for="why">辞める理由</label>
    <select id="why">
      <option value="self">自分の都合（転職・家庭の事情など）</option>
      <option value="kankoku">会社から退職をすすめられた</option>
      <option value="close">会社の事業の縮小・閉鎖</option>
      <option value="end">契約期間が満了する</option>
    </select>
  </div>

  <div class="card">
    <h2>2. 名前など</h2>
    <div class="row">
      <div><label class="f" for="co">会社名</label><input type="text" id="co" placeholder="例：株式会社みどり"></div>
      <div><label class="f" for="ceo">代表者の肩書きと名前</label><input type="text" id="ceo" placeholder="例：代表取締役 山田太郎"></div>
    </div>
    <div class="row">
      <div><label class="f" for="dept">自分の所属</label><input type="text" id="dept" placeholder="例：営業部"></div>
      <div><label class="f" for="me">自分の名前</label><input type="text" id="me" placeholder="例：佐藤花子"></div>
    </div>
    <label class="f" for="fmt">会社の決まった書式</label>
    <select id="fmt"><option value="none">ない・わからない</option><option value="yes">ある</option></select>
    <button id="make" type="button">文面を作る</button>
  </div>

  <div class="card" id="result" hidden>
    <h2>できあがり</h2>
    <div id="sum"></div>
    <h3>縦書きの見本（横にスクロールできます）</h3>
    <div class="paper-wrap"><div class="paper" id="paper"></div></div>
    <button type="button" class="copy" id="copy">文面をコピー</button>
    <h3>出し方と、出す時期</h3>
    <div class="box" id="how"></div>
  </div>

  <p class="note">※一般的な書き方の目安です。会社に決まった書式や手続きがあれば、そちらに従ってください。会社都合で辞める場合の書き方に迷ったら、会社の人事やハローワークに確かめてください。<br>
  最終更新：2026年10月　はじめての係</p>
</main>

<script>
(function () {
  var DEMO = location.search.indexOf("demo") >= 0;
  if (location.search.indexOf("mihon") >= 0) document.body.className = "mihon";
  function $(id) { return document.getElementById(id); }
  function v(id) { return $(id).value.trim(); }
  function pd(s) { if (!s) return null; var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  var KAN = "〇一二三四五六七八九";
  function kan(n) { // 漢数字（縦書き用）
    if (n < 10) return KAN[n];
    if (n < 20) return "十" + (n % 10 ? KAN[n % 10] : "");
    return KAN[Math.floor(n / 10)] + "十" + (n % 10 ? KAN[n % 10] : "");
  }
  function wareki(d) { // 令和
    if (!d) return "令和〇年〇月〇日";
    var y = d.getFullYear() - 2018;
    return "令和" + (y === 1 ? "元" : kan(y)) + "年" + kan(d.getMonth() + 1) + "月" + kan(d.getDate()) + "日";
  }
  var TEXT = "";
  function make() {
    var stage = $("stage").value, why = $("why").value, fmt = $("fmt").value;
    var quit = pd(v("quit")), sub = pd(v("sub"));
    var co = v("co") || "株式会社〇〇", ceo = v("ceo") || "代表取締役 〇〇〇〇", dept = v("dept") || "〇〇部", me = v("me") || "〇〇〇〇";
    var isTodoke = stage === "agreed";
    var title = isTodoke ? "退職届" : "退職願";
    var R = { self: "一身上の都合により", kankoku: "貴社からの退職勧奨に応じ", close: "貴社の事業縮小に伴い", end: "雇用契約期間の満了により" }[why];
    var end = isTodoke ? "退職いたします。" : "退職いたしたく、ここにお願い申し上げます。";
    TEXT = title + "\n\n" + "私儀\n" + "このたび、" + R + "、\n" + wareki(quit) + "をもって" + end + "\n\n" + wareki(sub) + "\n" + dept + "　" + me + "　印\n\n" + co + "\n" + ceo + "　様";
    $("paper").textContent = TEXT;
    var sb = $("sum"); sb.innerHTML = "";
    var el = document.createElement("div"); el.className = "big" + (fmt === "yes" || why !== "self" ? " ng" : "");
    el.innerHTML = '<div class="k">出すもの</div><div class="v"></div><div class="s"></div>';
    el.querySelector(".v").textContent = fmt === "yes" ? "会社の書式で出す" : title + "を出す";
    el.querySelector(".s").textContent = (fmt === "yes" ? "会社に決まった書式があるなら、それを使います。下の文面は、書式の「理由」の欄の書き方の参考にしてください。" :
      isTodoke ? "退職日が決まったあとは、「退職届」です。決まったことを伝える書類なので、出したあとに取り下げるのは、原則できません。" :
        "まだ上司に話していない段階なら、お願いの形の「退職願」です。ただ、多くの会社では、先に口で伝えてから書類を出します。") +
      (why !== "self" ? "会社都合の理由で辞めるときは、「一身上の都合」とは書きません。自己都合の扱いになり、失業保険で不利になることがあります。" : "");
    sb.appendChild(el);
    var h = [];
    if (!isTodoke) h.push("・先に、上司に口で伝えて、退職日を相談する（いきなり書類だけを渡さない）");
    h.push("・白い無地の便せんに、黒のボールペンか万年筆で手書きするのが一般的（パソコンで作ってよい会社も多い）",
      "・三つ折りにして、白い無地の封筒に入れる。表に「" + title + "」、裏に所属と名前",
      "・直属の上司に、手渡しで出す。「" + title + "をお持ちしました。ご確認をお願いいたします」",
      "・出す時期：" + (isTodoke ? "退職日が決まってすぐ。会社の決まり（〇か月前まで、など）があれば、それより前" : "退職日の1〜2か月前に上司に話してから"),
      "・控えとして、出す前にスマホで写真を撮っておく");
    $("how").textContent = h.join("\n");
    $("result").hidden = false;
  }
  $("copy").addEventListener("click", function (e) {
    var b = e.target, txt = TEXT;
    var ok = function () { b.textContent = "コピーしました"; setTimeout(function () { b.textContent = "文面をコピー"; }, 1500); };
    function fallback() {
      var t = document.createElement("textarea"); t.value = txt; document.body.appendChild(t);
      t.select(); try { document.execCommand("copy"); ok(); } catch (err) {} document.body.removeChild(t);
    }
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(ok, fallback); else fallback();
  });
  $("make").addEventListener("click", function () { make(); if (!DEMO) $("result").scrollIntoView({ behavior: "smooth" }); });
  if (DEMO) {
    $("quit").value = "2026-12-31"; $("sub").value = "2026-11-02";
    $("co").value = "株式会社みどり"; $("ceo").value = "代表取締役 山田太郎"; $("dept").value = "営業部"; $("me").value = "佐藤花子";
    make();
  }
})();
</script>
</body>
</html>
