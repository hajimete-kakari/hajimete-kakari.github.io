<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>はじめての係</title>
<style>
  :root { --bg: #faf8f5; --text: #2b2b2b; --sub: #6b6b6b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1e; --text: #ececec; --sub: #a5a5a5; } }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Hiragino Sans", "Noto Sans JP", "Meiryo", sans-serif; line-height: 1.7; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
  p { color: var(--sub); }
</style>
</head>
<body>
<main>
  <h1>はじめての係</h1>
  <p>noteの記事で使う計算ツールを置いています。各ツールのURLは、記事の中でご案内しています。</p>
</main>
</body>
</html>
