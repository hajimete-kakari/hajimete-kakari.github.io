<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>内定辞退の電話の一言｜はじめての係</title>
<style>
  :root {
    --bg: #faf8f5; --card: #ffffff; --text: #2b2b2b; --sub: #6b6b6b;
    --line: #e4dfd8; --accent: #2f6f5e; --accent-soft: #e6f0ec; --input: #fffbe8;
    --warn: #a4412f; --warn-soft: #f8e9e5; --mus: #c99a2e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --card: #26262a; --text: #ececec; --sub: #a5a5a5;
      --line: #3a3a3f; --accent: #7cc4ad; --accent-soft: #23372f; --input: #2e2c22;
      --warn: #f0a08f; --warn-soft: #3d2622; --mus: #e3c578;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", "Meiryo", sans-serif; line-height: 1.7; font-size: 16px; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 0 0 10px; }
  h3 { font-size: .98rem; margin: 18px 0 6px; }
  .lead { color: var(--sub); font-size: .9rem; margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  label.f { display: block; font-weight: 600; margin: 14px 0 6px; }
  .card > label.f:first-of-type { margin-top: 0; }
  .hint { font-weight: 400; color: var(--sub); font-size: .85rem; display: block; }
  input[type=text], select { width: 100%; font-size: 1rem; padding: 9px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--input); color: var(--text); font-family: inherit; }
  .row { display: flex; gap: 8px; } .row > div { flex: 1; min-width: 0; }
  button { width: 100%; font-size: 1rem; font-weight: 700; padding: 12px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; margin-top: 18px; cursor: pointer; font-family: inherit; }
  @media (prefers-color-scheme: dark) { button { color: #10231d; } }
  .copy { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 9px; font-size: .92rem; margin-top: 10px; }
  .big { border-radius: 10px; padding: 12px; margin-bottom: 8px; background: var(--accent-soft); }
  .big .k { font-size: .85rem; color: var(--sub); }
  .big .v { font-size: 1.05rem; font-weight: 700; }
  .big .s { font-size: .88rem; }
  .mail { white-space: pre-wrap; background: var(--input); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: .92rem; }
  .ng { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: .9rem; white-space: pre-wrap; }
  .note { font-size: .8rem; color: var(--sub); }
  [hidden] { display: none !important; }
  .mihon #sum .v, .mihon #sum .s, .mihon #tel, .mihon #kaeshi, .mihon #mail, .mihon #ng { filter: blur(6px); user-select: none; }
</style>
</head>
<body>
<main>
  <h1>内定辞退の電話の一言</h1>
  <p class="lead">内定を辞退するときの、電話の最初の一言から、理由の伝え方、聞かれたときの返し、電話がつながらないときのメールまでを作ります。入力した内容は、このページの外には送られません。</p>

  <div class="card">
    <h2>1. 相手と状況</h2>
    <div class="row">
      <div><label class="f" for="co">会社の名前</label><input type="text" id="co" placeholder="例：〇〇株式会社"></div>
      <div><label class="f" for="tan">担当の人の名前<span class="hint">わからなければ空</span></label><input type="text" id="tan" placeholder="例：佐藤"></div>
    </div>
    <label class="f" for="me">自分の名前</label>
    <input type="text" id="me" placeholder="例：山田花子">
    <label class="f" for="stage">今の段階</label>
    <select id="stage">
      <option value="naitei">内定をもらい、まだ返事をしていない</option>
      <option value="shodaku">一度、承諾の返事をしてしまった</option>
    </select>
    <label class="f" for="why">辞退する理由</label>
    <select id="why">
      <option value="other">ほかの会社に決めた</option>
      <option value="joken">条件（勤務地・時間など）が合わなかった</option>
      <option value="family">家庭の事情</option>
      <option value="now">今の会社に残ることにした</option>
    </select>
  </div>
  <button id="make" type="button">伝え方を作る</button>

  <div class="card" id="result" hidden style="margin-top:16px">
    <h2>できあがり</h2>
    <div id="sum"></div>
    <h3>電話で言うこと（最初の一言から）</h3>
    <div class="mail" id="tel"></div>
    <button type="button" class="copy" data-t="tel">台本をコピー</button>
    <h3>理由を聞かれたときの返し</h3>
    <div class="mail" id="kaeshi"></div>
    <h3>電話がつながらないときのメール</h3>
    <div class="mail" id="mail"></div>
    <button type="button" class="copy" data-t="mail">メールをコピー</button>
    <h3>しないほうがいいこと</h3>
    <div class="ng" id="ng"></div>
  </div>

  <p class="note">※文面の目安です。辞退は、決めたらできるだけ早く、会社の営業時間内に伝えます。<br>
  最終更新：2026年10月　はじめての係</p>
</main>

<script>
(function () {
  var DEMO = location.search.indexOf("demo") >= 0;
  if (location.search.indexOf("mihon") >= 0) document.body.className = "mihon";
  function $(id) { return document.getElementById(id); }
  function v(id) { return $(id).value.trim(); }
  var R = {
    other: ["ほかの会社からも内定をいただき、検討した結果、そちらに入社することにいたしました", "自分の経験を生かせる仕事の内容を考えて、決めました"],
    joken: ["勤務の条件について家族とも話し合い、今回は辞退させていただくことにいたしました", "通勤や勤務時間の面で、長く続けるのがむずかしいと考えました"],
    family: ["家庭の事情により、入社がむずかしくなりました", "くわしいことは控えさせてください。家庭の事情で、今は働き方を変えられない状況です"],
    now: ["今の職場と話し合った結果、残ることにいたしました", "今の職場で任される仕事が変わり、もう少し続けることにしました"]
  };
  function make() {
    var co = v("co") || "〇〇株式会社", tan = v("tan"), me = v("me") || "（自分の名前）", st = $("stage").value, r = R[$("why").value];
    var who = tan ? tan + "様" : "採用ご担当の方";
    var s = $("sum"); s.innerHTML = "";
    var el = document.createElement("div"); el.className = "big";
    el.innerHTML = '<div class="k">伝え方の順番</div><div class="v"></div><div class="s"></div>';
    el.querySelector(".v").textContent = "①名乗る → ②辞退を先に言う → ③理由はひと言 → ④お礼とお詫び";
    el.querySelector(".s").textContent = st === "shodaku" ? "承諾したあとでも、辞退を伝えることはできるのが一般的です。会社は入社の準備を進めているので、決めたらその日のうちに電話します。" : "辞退は電話で伝えるのが一般的です。決めたら、なるべく早く、会社の営業時間（昼休みと始業・終業の前後は避ける）に電話します。";
    s.appendChild(el);
    $("tel").textContent = "（つながったら）\nお世話になっております。先日、内定のご連絡をいただきました、" + me + "と申します。" + who + "はいらっしゃいますでしょうか。\n\n（担当の方に代わったら）\n" + (st === "shodaku" ? "先日は内定承諾のお返事をいたしましたが、" : "") + "大変申し訳ないのですが、このたびの内定を辞退させていただきたく、お電話いたしました。\n\n" + r[0] + "。\n\n選考に時間をいただいたにもかかわらず、このようなお返事となり、申し訳ございません。ご連絡いただいたこと、本当にありがとうございました。";
    $("kaeshi").textContent = "（理由をくわしく聞かれたら）\n「" + r[1] + "。」\n\n（引き止められたら）\n「ありがとうございます。よく考えて決めたことですので、お気持ちだけいただきます。」";
    $("mail").textContent = "件名：内定辞退のご連絡（" + me + "）\n\n" + co + "\n" + (tan ? tan + "様" : "採用ご担当者様") + "\n\nお世話になっております。" + me + "です。\n本日お電話いたしましたが、ご不在のようでしたので、メールにて失礼いたします。\n\n" + (st === "shodaku" ? "先日、内定承諾のお返事をいたしましたが、" : "") + "このたびいただいた内定を、辞退させていただきたく存じます。\n" + r[0] + "。\n\n選考にお時間をいただいたにもかかわらず、このようなご連絡となり、申し訳ございません。\n改めてお電話でもお詫びさせていただきます。\n\n" + me;
    $("ng").textContent = "・連絡をしないまま、入社日を待つ（会社は準備を進めている）\n・理由で相手の会社を悪く言う\n・メールだけで済ませる（つながらなかったときの連絡として使う）\n・夜遅くや休みの日に電話する";
    $("result").hidden = false;
  }
  [].forEach.call(document.querySelectorAll(".copy"), function (b) {
    b.addEventListener("click", function () {
      var txt = $(b.getAttribute("data-t")).textContent, label = b.textContent;
      var ok = function () { b.textContent = "コピーしました"; setTimeout(function () { b.textContent = label; }, 1500); };
      function fallback() {
        var t = document.createElement("textarea"); t.value = txt; document.body.appendChild(t);
        t.select(); try { document.execCommand("copy"); ok(); } catch (err) {} document.body.removeChild(t);
      }
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(ok, fallback); else fallback();
    });
  });
  $("make").addEventListener("click", function () { make(); if (!DEMO) $("result").scrollIntoView({ behavior: "smooth" }); });
  if (DEMO) { $("co").value = "〇〇株式会社"; $("tan").value = "佐藤"; $("me").value = "山田花子"; make(); }
})();
</script>
</body>
</html>
