<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>年末年始の帰省を断る一言｜はじめての係</title>
<style>
  :root {
    --bg: #faf8f5; --card: #ffffff; --text: #2b2b2b; --sub: #6b6b6b;
    --line: #e4dfd8; --accent: #2f6f5e; --accent-soft: #e6f0ec; --input: #fffbe8;
    --warn: #a4412f; --warn-soft: #f8e9e5; --mus: #c99a2e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --card: #26262a; --text: #ececec; --sub: #a5a5a5;
      --line: #3a3a3f; --accent: #7cc4ad; --accent-soft: #23372f; --input: #2e2c22;
      --warn: #f0a08f; --warn-soft: #3d2622; --mus: #e3c578;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", "Meiryo", sans-serif; line-height: 1.7; font-size: 16px; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 0 0 10px; }
  h3 { font-size: .98rem; margin: 18px 0 6px; }
  .lead { color: var(--sub); font-size: .9rem; margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  label.f { display: block; font-weight: 600; margin: 14px 0 6px; }
  .card > label.f:first-of-type { margin-top: 0; }
  .hint { font-weight: 400; color: var(--sub); font-size: .85rem; display: block; }
  input[type=text], select { width: 100%; font-size: 1rem; padding: 9px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--input); color: var(--text); font-family: inherit; }
  .row { display: flex; gap: 8px; } .row > div { flex: 1; min-width: 0; }
  button { width: 100%; font-size: 1rem; font-weight: 700; padding: 12px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; margin-top: 18px; cursor: pointer; font-family: inherit; }
  @media (prefers-color-scheme: dark) { button { color: #10231d; } }
  .copy { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 9px; font-size: .92rem; margin-top: 10px; }
  .big { border-radius: 10px; padding: 12px; margin-bottom: 8px; background: var(--accent-soft); }
  .big .k { font-size: .85rem; color: var(--sub); }
  .big .v { font-size: 1.05rem; font-weight: 700; }
  .big .s { font-size: .88rem; }
  .first { background: var(--input); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .mail { white-space: pre-wrap; background: var(--input); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: .92rem; }
  .ng { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: .9rem; white-space: pre-wrap; }
  .note { font-size: .8rem; color: var(--sub); }
  [hidden] { display: none !important; }
  .mihon #sum .k, .mihon #sum .v, .mihon #sum .s, .mihon #toSp, .mihon #msg, .mihon #alt2, .mihon #ng { filter: blur(6px); user-select: none; }
</style>
</head>
<body>
<main>
  <h1>年末年始の帰省を断る一言</h1>
  <p class="lead">年末年始の義実家への帰省を、今回は断りたい・短くしたいときの伝え方を作ります。誘ってきた人と理由、代わりの案を選ぶと、配偶者に先に話す一言、義実家への連絡の文面、代わりの案の伝え方が出ます。入力した内容は、このページの外には送られません。</p>

  <div class="card">
    <h2>1. 誘われ方</h2>
    <label class="f" for="from">誘ってきた人</label>
    <select id="from">
      <option value="mother">義理のお母さん</option>
      <option value="father">義理のお父さん</option>
      <option value="spouse">配偶者を通して聞かれた</option>
    </select>
    <label class="f" for="who">義実家に伝える人</label>
    <select id="who"><option value="spouse">配偶者から伝えてもらう</option><option value="me">自分から伝える</option></select>
    <div class="row">
      <div><label class="f" for="sp">配偶者の呼び方</label><input type="text" id="sp" placeholder="例：夫・妻・〇〇さん"></div>
      <div><label class="f" for="call">相手の呼び方</label><input type="text" id="call" placeholder="例：お義母さん"></div>
    </div>
  </div>

  <div class="card">
    <h2>2. 理由と代わりの案</h2>
    <label class="f" for="why">今回は行けない（短くしたい）理由</label>
    <select id="why">
      <option value="kid">子どもの体調・受験・行事</option>
      <option value="work">年末年始も仕事がある</option>
      <option value="move">移動の負担・費用が大きい</option>
      <option value="health">自分の体調を整えたい</option>
      <option value="rest">家でゆっくり休みたい（そのままは言いにくい）</option>
    </select>
    <label class="f" for="alt">代わりの案</label>
    <select id="alt">
      <option value="shift">年末年始を避けて、別の日に行く</option>
      <option value="short">日帰り・1泊など、短く寄る</option>
      <option value="split">配偶者（と子ども）だけ行く</option>
      <option value="video">今回はビデオ通話にする</option>
    </select>
    <button id="make" type="button">伝え方を作る</button>
  </div>

  <div class="card" id="result" hidden>
    <h2>できあがり</h2>
    <div id="sum"></div>
    <h3>先に、配偶者に話す一言</h3>
    <div class="first" id="toSp"></div>
    <h3>義実家への連絡（メッセージ）</h3>
    <div class="mail" id="msg"></div>
    <button type="button" class="copy" id="copy">メッセージをコピー</button>
    <h3>代わりの案を伝える一言</h3>
    <div class="first" id="alt2"></div>
    <h3>しないほうがいいこと</h3>
    <div class="ng" id="ng"></div>
  </div>

  <p class="note">※伝え方の目安です。家ごとのしきたりや関係によって、言い方を調整してください。<br>
  最終更新：2026年10月　はじめての係</p>
</main>

<script>
(function () {
  var DEMO = location.search.indexOf("demo") >= 0;
  if (location.search.indexOf("mihon") >= 0) document.body.className = "mihon";
  function $(id) { return document.getElementById(id); }
  function v(id) { return $(id).value.trim(); }
  var MSG = "";
  function make() {
    var from = $("from").value, who = $("who").value, why = $("why").value, alt = $("alt").value;
    var sp = v("sp") || "配偶者", call = v("call") || (from === "father" ? "お義父さん" : "お義母さん");
    var sb = $("sum"); sb.innerHTML = "";
    var el = document.createElement("div"); el.className = "big";
    el.innerHTML = '<div class="k">伝える順番</div><div class="v"></div><div class="s"></div>';
    el.querySelector(".v").textContent = who === "spouse" ? "① " + sp + "と決める → ② " + sp + "から伝えてもらう → ③ 代わりの案を添える" : "① " + sp + "と決める → ② 自分から伝える → ③ 代わりの案を添える";
    el.querySelector(".s").textContent = "義実家への連絡は、実の子である" + sp + "からのほうが、角が立ちにくいのが一般的です。早めに、12月の初めまでには伝えます。" + (why === "rest" ? "「休みたい」はそのまま言わず、家族の体調や予定の形にします。" : "");
    sb.appendChild(el);
    var R = {
      kid: ["子どもの体調（受験・行事）があって", "子どもの体調（受験）のこともあり"],
      work: ["年末年始も仕事が入っていて", "年末年始も仕事が入ってしまい"],
      move: ["移動の負担が大きくて", "移動の負担を考えて"],
      health: ["私の体調を整えたくて", "私の体調を整えたいこともあり"],
      rest: ["年末は家族の予定が重なっていて", "家族の予定が重なってしまい"]
    }[why];
    var A = {
      shift: ["年末年始を避けて、" + "〇月ごろに行くのはどうかな", "年末年始は少しずらして、〇月ごろにうかがえたらと思っています"],
      short: ["今回は日帰り（1泊）で寄るのはどうかな", "今回は日帰り（1泊）で、少しだけ顔を出させてください"],
      split: [sp + "（と子どもたち）だけで行ってもらうのはどうかな", sp + "（と子どもたち）だけでうかがわせてください"],
      video: ["今回はビデオ通話で、みんなで顔を見て話すのはどうかな", "今回は、ビデオ通話で新年のごあいさつをさせてください"]
    }[alt];
    $("toSp").textContent = "「年末年始のことなんだけど、" + R[0] + "、今回はいつもどおりの帰省はむずかしそうなんだ。" + A[0] + "。" + (who === "spouse" ? call + "には、" + sp + "から伝えてもらえると助かる。」" : "私から連絡しようと思うけど、どうかな。」");
    var head = who === "spouse" ? "（" + sp + "から送る文）\n" : "";
    MSG = head + call + "\n\nいつもありがとうございます。年末年始のお誘いも、ありがとうございます。\n\n" +
      "今年は、" + R[1] + "、いつものようにうかがうのがむずかしそうです。\n" + A[1] + "。\n\n" +
      "せっかく声をかけていただいたのに、ごめんなさい。" + (alt === "video" ? "みんなの顔を、画面で見てもらえたらうれしいです。" : "会えるのを楽しみにしています。") +
      "\n寒くなりますので、どうぞお体に気をつけて。";
    $("msg").textContent = MSG;
    $("alt2").textContent = "「" + A[1] + "。お正月には、こちらから電話しますね。」（年末に、小さなお菓子や地元の品を送っておくと、気持ちが伝わりやすくなります）";
    $("ng").textContent = "・配偶者に相談せずに、自分だけで断る\n・「行きたくない」とそのまま言う\n・ぎりぎり（年末の直前）に断る\n・断ったあと、年末年始に何も連絡しない";
    $("result").hidden = false;
  }
  $("copy").addEventListener("click", function (e) {
    var b = e.target, txt = MSG;
    var ok = function () { b.textContent = "コピーしました"; setTimeout(function () { b.textContent = "メッセージをコピー"; }, 1500); };
    function fallback() {
      var t = document.createElement("textarea"); t.value = txt; document.body.appendChild(t);
      t.select(); try { document.execCommand("copy"); ok(); } catch (err) {} document.body.removeChild(t);
    }
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(ok, fallback); else fallback();
  });
  $("make").addEventListener("click", function () { make(); if (!DEMO) $("result").scrollIntoView({ behavior: "smooth" }); });
  if (DEMO) {
    $("sp").value = "夫"; $("call").value = "お義母さん"; $("alt").value = "short";
    make();
  }
})();
</script>
</body>
</html>
