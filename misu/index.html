<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ミスの報告の作成ページ｜はじめての係</title>
<style>
  :root {
    --bg: #faf8f5; --card: #ffffff; --text: #2b2b2b; --sub: #6b6b6b;
    --line: #e4dfd8; --accent: #2f6f5e; --accent-soft: #e6f0ec; --input: #fffbe8;
    --warn: #a4412f; --warn-soft: #f8e9e5; --mus: #c99a2e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --card: #26262a; --text: #ececec; --sub: #a5a5a5;
      --line: #3a3a3f; --accent: #7cc4ad; --accent-soft: #23372f; --input: #2e2c22;
      --warn: #f0a08f; --warn-soft: #3d2622; --mus: #e3c578;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", "Meiryo", sans-serif; line-height: 1.7; font-size: 16px; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 0 0 10px; }
  h3 { font-size: .98rem; margin: 18px 0 6px; }
  .lead { color: var(--sub); font-size: .9rem; margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  label.f { display: block; font-weight: 600; margin: 14px 0 6px; }
  .card > label.f:first-of-type { margin-top: 0; }
  .hint { font-weight: 400; color: var(--sub); font-size: .85rem; display: block; }
  input[type=text], select, textarea { width: 100%; font-size: 1rem; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--input); color: var(--text); font-family: inherit; }
  textarea { min-height: 64px; resize: vertical; }
  .row { display: flex; gap: 8px; } .row > div { flex: 1; min-width: 0; }
  button { width: 100%; font-size: 1rem; font-weight: 700; padding: 12px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; margin-top: 18px; cursor: pointer; font-family: inherit; }
  @media (prefers-color-scheme: dark) { button { color: #10231d; } }
  .copy { margin-top: 8px; padding: 9px; font-size: .92rem; background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .first { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-weight: 700; }
  .mail { white-space: pre-wrap; background: var(--input); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: .95rem; }
  .sec { font-size: .85rem; color: var(--sub); margin-top: 4px; }
  .q { border-left: 4px solid var(--accent); padding: 4px 0 6px 12px; margin-bottom: 10px; }
  .q .nm { font-weight: 700; }
  .q .w { font-size: .88rem; color: var(--sub); }
  .note { font-size: .8rem; color: var(--sub); }
  [hidden] { display: none !important; }
  .mihon #say, .mihon #chat, .mihon #first, .mihon #qs .w { filter: blur(6px); user-select: none; }
</style>
</head>
<body>
<main>
  <h1>ミスの報告の作成ページ</h1>
  <p class="lead">仕事でミスに気づいたとき、上司に何をどの順で言えばいいかを作ります。起きたこと・影響・今やっていることを入れると、最初の声のかけ方、口で言う30秒の報告、チャットで送る短い文ができます。入力した内容は、このページの外には送られません。</p>

  <div class="card">
    <h2>1. 何が起きたか</h2>
    <label class="f" for="aite">報告する相手</label>
    <select id="aite"><option value="ue">上司</option><option value="senpai">先輩・教えてくれている人</option><option value="team">チームのみんな（チャット）</option></select>
    <label class="f" for="nani">起きたこと（事実だけ）<span class="hint">例：〇〇社に送った見積書の金額を、1桁まちがえて送った</span></label>
    <textarea id="nani"></textarea>
    <div class="row">
      <div><label class="f" for="itsu">いつ・どうやって気づいたか</label>
        <select id="itsu"><option value="now">いま自分で気づいた</option><option value="before">少し前に気づいていた</option><option value="told">相手（お客さん・取引先）に言われた</option><option value="other">ほかの人に言われた</option></select></div>
      <div><label class="f" for="soto">外に出ているか</label>
        <select id="soto"><option value="out">社外（お客さん・取引先）に出ている</option><option value="in">社内だけ</option><option value="notyet">まだ外には出ていない</option></select></div>
    </div>
    <label class="f" for="eikyo">影響（わかる範囲で）<span class="hint">例：〇〇社が、まちがった金額で社内の稟議を出しているかもしれない</span></label>
    <input type="text" id="eikyo">
  </div>

  <div class="card">
    <h2>2. 今やっていること</h2>
    <label class="f" for="ima">今やっていること・もうやったこと<span class="hint">例：正しい見積書を作り直している（10分で送れる）</span></label>
    <input type="text" id="ima">
    <label class="f" for="kimete">上司に決めてほしいこと<span class="hint">例：〇〇社への連絡を、私からするか、〇〇さんからするか</span></label>
    <input type="text" id="kimete">
    <label class="f" for="gen">原因は？</label>
    <select id="gen"><option value="later">まだはっきりしない・あとで報告する</option><option value="known">わかっている</option></select>
    <input type="text" id="genin" placeholder="例：前の見積書をコピーして、数字を直し忘れた" hidden style="margin-top:8px">
    <button id="make" type="button">報告を作る</button>
  </div>

  <div class="card" id="result" hidden>
    <h2>できあがり</h2>
    <h3>最初の声のかけ方</h3>
    <div class="first" id="first"></div>
    <h3>口で言う報告</h3>
    <div class="mail" id="say"></div>
    <div class="sec" id="sec"></div>
    <button type="button" class="copy" id="copySay">報告をコピー（メモ用）</button>
    <h3>チャットで送るとき</h3>
    <div class="mail" id="chat"></div>
    <button type="button" class="copy" id="copyChat">チャットの文をコピー</button>
    <h3>話す前に、10秒で確かめる</h3>
    <div id="qs"></div>
  </div>

  <p class="note">※会社に報告のルール（報告書の様式・報告先）がある場合は、そちらを優先してください。<br>
  最終更新：2026年10月　はじめての係</p>
</main>

<script>
(function () {
  var DEMO = location.search.indexOf("demo") >= 0;
  if (location.search.indexOf("mihon") >= 0) document.body.className = "mihon";
  function $(id) { return document.getElementById(id); }
  function v(id) { return $(id).value.trim(); }
  function strip(s) { return s.replace(/[。．.]+$/, ""); }
  $("gen").addEventListener("change", function () { $("genin").hidden = $("gen").value !== "known"; });

  function make() {
    var aite = $("aite").value, nani = strip(v("nani") || "〇〇をまちがえました"), itsu = $("itsu").value, soto = $("soto").value;
    var eikyo = strip(v("eikyo")), ima = strip(v("ima")), kimete = strip(v("kimete"));
    var known = $("gen").value === "known", genin = strip(v("genin"));
    var name = aite === "team" ? "みなさん" : "〇〇さん";
    var urgent = soto === "out" || itsu === "told";

    $("first").textContent = aite === "team" ? "（チャットの最初の行）【ご報告】" + (urgent ? "【急ぎ】" : "") + "ミスがありました" :
      "「" + name + "、すみません。" + (urgent ? "急ぎで" : "") + "お伝えしたいことがあります。" + (urgent ? "1分だけ、よろしいですか。" : "今、少しよろしいですか。") + "」";

    var how = { now: "先ほど、自分で気づきました。", before: "少し前に気づいていたのですが、報告が遅くなりました。", told: "先ほど、先方からのご連絡で気づきました。", other: "先ほど、〇〇さんに言われて気づきました。" }[itsu];
    var where = { out: "", in: "社内だけで、外には出ていません。", notyet: "まだ外には出ていません。" }[soto];
    var parts = [];
    parts.push("申し訳ありません。" + nani + "。");
    parts.push(how);
    if (eikyo || where) parts.push((where ? where : "") + (eikyo ? "影響としては、" + eikyo + "。" : ""));
    if (ima) parts.push("今、" + ima + "。");
    if (kimete) parts.push(kimete + "を、決めていただけますか。");
    parts.push(known && genin ? "原因は、" + genin + "ことです。くわしくは、落ち着いたら改めてご報告します。" : "原因は、対応が落ち着いたら改めてご報告します。");
    var say = parts.join("\n");
    $("say").textContent = say;
    var chars = say.replace(/\s/g, "").length;
    var sec = Math.round(chars / 5); // 1秒に5文字くらいの、ゆっくりめの速さ
    $("sec").textContent = "声に出すと、約" + sec + "秒（" + chars + "字）。" + (sec > 40 ? "長いので、影響か原因を短くします。" : "30秒前後で言えます。");

    var chat = "【ご報告】" + (urgent ? "【急ぎ】" : "") + "\n" + nani + "。\n" +
      (eikyo ? "影響：" + eikyo + "\n" : (where ? "影響：" + where.replace(/。$/, "") + "\n" : "")) +
      (ima ? "対応：" + ima + "\n" : "") + (kimete ? "ご判断いただきたいこと：" + kimete + "\n" : "") +
      "原因は、落ち着いたら改めてご報告します。申し訳ありません。";
    $("chat").textContent = chat;

    var qs = [
      ["1行目で「ミスがあった」と言えるか", "経緯から話し始めると、聞く側は何の話かわからないまま待つことになります。結論が先です"],
      ["事実と、自分の考え（推測）を分けたか", "「たぶん〜だと思います」は、事実のあとに、そうとわかる言い方で添えます"],
      ["言い訳から入っていないか", "「忙しくて」「〇〇さんに言われたとおりに」は、最初には言いません。原因はあとで報告します"]
    ];
    if (itsu === "before") qs.unshift(["気づいてから時間がたっている", "遅れたことも、最初に一緒に謝ります。これ以上待たずに、今伝えるのがいちばん傷が浅く済みます"]);
    var qb = $("qs"); qb.innerHTML = "";
    qs.forEach(function (x) {
      var d = document.createElement("div"); d.className = "q";
      d.innerHTML = '<div class="nm"></div><div class="w"></div>';
      d.querySelector(".nm").textContent = x[0]; d.querySelector(".w").textContent = x[1];
      qb.appendChild(d);
    });
    $("result").hidden = false;
  }
  function copy(id, b, label) {
    var txt = $(id).textContent;
    var ok = function () { b.textContent = "コピーしました"; setTimeout(function () { b.textContent = label; }, 1500); };
    function fallback() {
      var t = document.createElement("textarea"); t.value = txt; document.body.appendChild(t);
      t.select(); try { document.execCommand("copy"); ok(); } catch (e) {} document.body.removeChild(t);
    }
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(ok, fallback); else fallback();
  }
  $("copySay").addEventListener("click", function (e) { copy("say", e.target, "報告をコピー（メモ用）"); });
  $("copyChat").addEventListener("click", function (e) { copy("chat", e.target, "チャットの文をコピー"); });
  $("make").addEventListener("click", function () { make(); if (!DEMO) $("result").scrollIntoView({ behavior: "smooth" }); });
  if (DEMO) {
    $("nani").value = "〇〇社に送った見積書の金額を、1桁まちがえて送りました";
    $("soto").value = "out";
    $("eikyo").value = "〇〇社が、その金額で社内の確認を進めているかもしれません";
    $("ima").value = "正しい見積書を作り直していて、10分で送れます";
    $("kimete").value = "〇〇社へのおわびの連絡を、私からするか、〇〇さんからするか";
    make();
  }
})();
</script>
</body>
</html>
