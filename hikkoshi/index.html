<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>引越しのやることリスト作成｜はじめての係</title>
<style>
  :root {
    --bg: #faf8f5; --card: #ffffff; --text: #2b2b2b; --sub: #6b6b6b;
    --line: #e4dfd8; --accent: #2f6f5e; --accent-soft: #e6f0ec; --input: #fffbe8; --done: #9a9a9a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --card: #26262a; --text: #ececec; --sub: #a5a5a5;
      --line: #3a3a3f; --accent: #7cc4ad; --accent-soft: #23372f; --input: #2e2c22; --done: #777;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", "Meiryo", sans-serif; line-height: 1.7; font-size: 16px; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 0 0 8px; }
  .lead { color: var(--sub); font-size: .9rem; margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  label.f { display: block; font-weight: 600; margin: 14px 0 6px; }
  label.f:first-child { margin-top: 0; }
  input[type=date], select { width: 100%; font-size: 1rem; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--input); color: var(--text); font-family: inherit; }
  .opts { display: grid; gap: 6px; }
  .opts label { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; background: var(--input); }
  button { width: 100%; font-size: 1rem; font-weight: 700; padding: 12px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; margin-top: 18px; cursor: pointer; font-family: inherit; }
  @media (prefers-color-scheme: dark) { button { color: #10231d; } }
  .group h3 { font-size: 1rem; margin: 18px 0 6px; padding: 6px 10px; background: var(--accent-soft); border-radius: 8px; }
  .group h3 .d { font-weight: 400; font-size: .85rem; color: var(--sub); margin-left: 4px; }
  .task { display: flex; gap: 10px; align-items: flex-start; padding: 8px 2px; border-bottom: 1px solid var(--line); }
  .task input { margin-top: 6px; width: 18px; height: 18px; flex: none; }
  .task .name { font-weight: 600; }
  .task .where { font-size: .85rem; color: var(--sub); }
  .task.done .name, .task.done .where { color: var(--done); text-decoration: line-through; }
  .progress { font-size: .9rem; color: var(--sub); margin: 0 0 4px; }
  .note { font-size: .8rem; color: var(--sub); }
  .copy { background: transparent; color: var(--accent); border: 1px solid var(--accent); margin-top: 12px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>引越しのやることリスト作成</h1>
  <p class="lead">引越し日と状況を選ぶと、「いつまでに・どこで・何をするか」の日付つきリストができます。終わったものにチェックを入れながら進められます。入力した内容は、このページの外には送られません。</p>

  <div class="card">
    <label class="f" for="day">引越し日（新しい家に移る日）</label>
    <input type="date" id="day">

    <label class="f" for="area">引越し先</label>
    <select id="area">
      <option value="other">今と違う市区町村</option>
      <option value="same">今と同じ市区町村</option>
    </select>

    <label class="f">当てはまるもの</label>
    <div class="opts" id="opts">
      <label><input type="checkbox" value="rent" checked> 今の家は賃貸（解約する）</label>
      <label><input type="checkbox" value="mynumber" checked> マイナンバーカードを持っている</label>
      <label><input type="checkbox" value="net"> インターネット回線を引いている</label>
      <label><input type="checkbox" value="kids"> 子どもがいる（学校・保育園・児童手当）</label>
      <label><input type="checkbox" value="car"> 車・バイクを持っている</label>
      <label><input type="checkbox" value="dog"> 犬を飼っている</label>
      <label><input type="checkbox" value="kokuho"> 国民健康保険・国民年金に入っている</label>
    </div>
    <button id="make" type="button">リストを作る</button>
  </div>

  <div class="card" id="result" hidden>
    <h2>やることリスト</h2>
    <p class="progress" id="progress"></p>
    <div id="list"></div>
    <button class="copy" id="copy" type="button">リストをコピーする</button>
    <p class="note" id="copied" hidden>コピーしました。メモ帳などに貼り付けて使ってください。</p>
  </div>

  <p class="note">※期限や受付の方法は、市区町村や会社によって違うことがあります。とくに役所の手続きは、引越し先の市区町村のホームページで確認してください。<br>
  ※チェックの状態は、このスマホ・パソコンのブラウザにだけ保存されます。<br>
  最終更新：2026年10月　はじめての係</p>
</main>

<script>
(function () {
  // [いつ（引越し日からの日数）, 区切り, 名前, どこで・メモ, 条件]
  var T = [
    [-45, "1か月以上前", "引越し業者の見積もりを取る", "2〜3社に頼むと比べやすい。3〜4月は早めに", ""],
    [-30, "1か月前", "今の家の解約を連絡する", "管理会社・大家さん。契約書の「解約予告」の期間を確認", "rent"],
    [-30, "1か月前", "インターネット回線の移転・解約を申し込む", "工事が必要だと、開通まで時間がかかる", "net"],
    [-30, "1か月前", "学校・保育園に転校・転園を伝える", "在学証明書などの書類を受け取る", "kids"],
    [-30, "1か月前", "粗大ごみの収集を申し込む", "市区町村の受付。予約が埋まりやすい", ""],
    [-14, "2週間前", "転出届を出す", "今の市区町村の窓口。マイナンバーカードがあればオンラインでも", "other"],
    [-14, "2週間前", "郵便の転送を申し込む", "郵便局の窓口かネット（e転居）。届くまで数日かかる", ""],
    [-7, "1週間前", "電気の使用停止・開始を申し込む", "今の家と新しい家の両方。ネットで申し込めることが多い", ""],
    [-7, "1週間前", "ガスの停止・開始を申し込む", "新しい家の開栓は立ち会いが必要。日時を予約", ""],
    [-7, "1週間前", "水道の停止・開始を申し込む", "市区町村の水道局", ""],
    [-1, "前日", "冷蔵庫の電源を切り、水を抜く", "霜取りの水が出るのでタオルを用意", ""],
    [0, "当日", "今の家の退去立会い・鍵の返却", "部屋の写真を撮っておく", "rent"],
    [0, "当日", "新しい家のガスの開栓に立ち会う", "予約した時間に在宅", ""],
    [14, "引越しから14日以内", "転入届を出す", "新しい市区町村の窓口。転出証明書（または、マイナンバーカード）を持っていく", "other"],
    [14, "引越しから14日以内", "転居届を出す", "同じ市区町村の中での引越し", "same"],
    [14, "引越しから14日以内", "マイナンバーカードの住所を書き換える", "転入届・転居届と同じ窓口で。カードと暗証番号を持っていく", "mynumber"],
    [14, "引越しから14日以内", "国民健康保険・国民年金の住所変更", "転入届と同じ日に、同じ庁舎で", "kokuho"],
    [14, "引越しから14日以内", "児童手当の申請", "新しい市区町村で。前の市区町村の手当は止まる", "kidsOther"],
    [14, "引越しから14日以内", "転校・転園の手続き", "新しい市区町村の窓口・学校で", "kids"],
    [15, "引越しから15日以内", "車検証の住所変更", "運輸支局（軽自動車は軽自動車検査協会）。車庫証明が先に必要なことが多い", "car"],
    [30, "引越しから30日以内", "犬の登録の住所変更", "新しい市区町村の窓口", "dog"],
    [30, "落ち着いたら早めに", "運転免許証の住所変更", "新しい住所の警察署・運転免許センター", ""],
    [30, "落ち着いたら早めに", "銀行・クレジットカードの住所変更", "アプリやネットで変えられることが多い", ""],
    [30, "落ち着いたら早めに", "携帯電話・保険・通販サイトの住所変更", "勤務先への届け出も忘れずに", ""]
  ];
  var WD = ["日","月","火","水","木","金","土"];
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function key(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function fmt(d) { return (d.getMonth() + 1) + "月" + d.getDate() + "日（" + WD[d.getDay()] + "）"; }
  function add(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function parse(v) { var p = v.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function load() { try { return JSON.parse(localStorage.getItem("hikkoshi-done") || "{}"); } catch (e) { return {}; } }
  function save(o) { try { localStorage.setItem("hikkoshi-done", JSON.stringify(o)); } catch (e) {} }

  var today = new Date(); today.setHours(0, 0, 0, 0);
  document.getElementById("day").value = key(add(today, 40));

  var lastText = "";
  function make() {
    var day = parse(document.getElementById("day").value);
    var area = document.getElementById("area").value;
    var on = {}; on[area] = true; on[""] = true;
    document.querySelectorAll("#opts input:checked").forEach(function (c) { on[c.value] = true; });
    if (on.kids && area === "other") on.kidsOther = true;
    var done = load();
    var list = document.getElementById("list"); list.innerHTML = "";
    var lines = ["【引越しのやることリスト】引越し日 " + fmt(day)];
    var groups = [];
    T.forEach(function (t) {
      if (!on[t[4]]) return;
      var g = groups[groups.length - 1];
      if (!g || g.label !== t[1]) { g = { label: t[1], off: t[0], items: [] }; groups.push(g); }
      g.items.push(t);
    });
    var total = 0, fin = 0;
    groups.forEach(function (g) {
      var wrap = document.createElement("div"); wrap.className = "group";
      var date = add(day, g.off);
      var h = document.createElement("h3");
      var when = g.off < -1 ? fmt(date) + "ごろまで" : g.off <= 0 ? fmt(date) : fmt(date) + "まで";
      if (g.label.indexOf("落ち着いたら") === 0) when = "";
      h.innerHTML = g.label + (when ? '<span class="d">' + when + '</span>' : "");
      wrap.appendChild(h);
      lines.push("", "■" + g.label + (when ? "（" + when + "）" : ""));
      g.items.forEach(function (t) {
        var id = t[2]; total++;
        var row = document.createElement("label"); row.className = "task";
        var cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = !!done[id];
        if (cb.checked) { row.classList.add("done"); fin++; }
        cb.addEventListener("change", function () {
          var d = load(); if (cb.checked) d[id] = 1; else delete d[id]; save(d);
          row.classList.toggle("done", cb.checked); count();
        });
        var txt = document.createElement("div");
        txt.innerHTML = '<div class="name">' + t[2] + '</div><div class="where">' + t[3] + '</div>';
        row.appendChild(cb); row.appendChild(txt); wrap.appendChild(row);
        lines.push("□ " + t[2] + "（" + t[3] + "）");
      });
      list.appendChild(wrap);
    });
    function count() {
      var all = list.querySelectorAll(".task input").length, ok = list.querySelectorAll(".task input:checked").length;
      document.getElementById("progress").textContent = "終わったもの：" + ok + " / " + all;
    }
    count();
    lastText = lines.join("\n");
    document.getElementById("result").hidden = false;
    document.getElementById("copied").hidden = true;
  }
  document.getElementById("make").addEventListener("click", function () {
    make();
    if (location.search.indexOf("demo") < 0) document.getElementById("result").scrollIntoView({ behavior: "smooth" });
  });
  document.getElementById("copy").addEventListener("click", function () {
    if (!lastText) return;
    var done = function () { document.getElementById("copied").hidden = false; };
    function fallback() {
      var t = document.createElement("textarea"); t.value = lastText; document.body.appendChild(t);
      t.select(); try { document.execCommand("copy"); done(); } catch (e) {} document.body.removeChild(t);
    }
    if (navigator.clipboard) navigator.clipboard.writeText(lastText).then(done, fallback); else fallback();
  });
  if (location.search.indexOf("demo") >= 0) {
    document.getElementById("day").value = "2026-11-21";
    document.querySelector("#opts input[value=kids]").checked = true;
    make();
  }
})();
</script>
</body>
</html>
