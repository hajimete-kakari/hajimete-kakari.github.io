<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>結婚式を欠席するときの返信の一言｜はじめての係</title>
<style>
  :root {
    --bg: #faf8f5; --card: #ffffff; --text: #2b2b2b; --sub: #6b6b6b;
    --line: #e4dfd8; --accent: #2f6f5e; --accent-soft: #e6f0ec; --input: #fffbe8;
    --warn: #a4412f; --warn-soft: #f8e9e5; --mus: #c99a2e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --card: #26262a; --text: #ececec; --sub: #a5a5a5;
      --line: #3a3a3f; --accent: #7cc4ad; --accent-soft: #23372f; --input: #2e2c22;
      --warn: #f0a08f; --warn-soft: #3d2622; --mus: #e3c578;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", "Meiryo", sans-serif; line-height: 1.7; font-size: 16px; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 0 0 10px; }
  h3 { font-size: .98rem; margin: 18px 0 6px; }
  .lead { color: var(--sub); font-size: .9rem; margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  label.f { display: block; font-weight: 600; margin: 14px 0 6px; }
  .card > label.f:first-of-type { margin-top: 0; }
  .hint { font-weight: 400; color: var(--sub); font-size: .85rem; display: block; }
  input[type=text], select { width: 100%; font-size: 1rem; padding: 9px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--input); color: var(--text); font-family: inherit; }
  button { width: 100%; font-size: 1rem; font-weight: 700; padding: 12px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; margin-top: 18px; cursor: pointer; font-family: inherit; }
  @media (prefers-color-scheme: dark) { button { color: #10231d; } }
  .copy { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 9px; font-size: .92rem; margin-top: 10px; }
  .big { border-radius: 10px; padding: 12px; margin-bottom: 8px; background: var(--accent-soft); }
  .big .k { font-size: .85rem; color: var(--sub); }
  .big .v { font-size: 1.05rem; font-weight: 700; }
  .big .s { font-size: .88rem; }
  .mail { white-space: pre-wrap; background: var(--input); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: .92rem; }
  .ng { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: .9rem; white-space: pre-wrap; }
  .note { font-size: .8rem; color: var(--sub); }
  [hidden] { display: none !important; }
  .mihon #sum .v, .mihon #sum .s, .mihon #msg, .mihon #pre, .mihon #ng { filter: blur(6px); user-select: none; }
</style>
</head>
<body>
<main>
  <h1>結婚式を欠席するときの返信の一言</h1>
  <p class="lead">結婚式の招待に、欠席で返事をするときのメッセージを作ります。相手との間柄と欠席の理由を入れると、はがきの余白やWeb招待状のメッセージ欄にそのまま書ける一言と、返信の前に伝える一言が出ます。入力した内容は、このページの外には送られません。</p>

  <div class="card">
    <h2>1. 相手</h2>
    <label class="f" for="nm">相手の呼び方<span class="hint">ふだん呼んでいる形で。例：さき／田中さん</span></label>
    <input type="text" id="nm" placeholder="例：さき">
    <label class="f" for="rel">間柄</label>
    <select id="rel">
      <option value="friend">友人（ふだんはくだけた話し方）</option>
      <option value="peer">職場の同僚・先輩</option>
      <option value="boss">職場の上司・目上の人</option>
      <option value="family">親族</option>
    </select>
    <h2 style="margin-top:20px">2. 欠席のこと</h2>
    <label class="f" for="why">欠席の理由</label>
    <select id="why">
      <option value="plan">先に決まっていた予定・仕事</option>
      <option value="far">遠方で、当日行くのが難しい</option>
      <option value="body">体調のこと（妊娠・出産をふくむ）</option>
      <option value="loss">身内の不幸・法事</option>
      <option value="other">理由は言いにくい</option>
    </select>
    <label class="f" for="how">返信の方法</label>
    <select id="how">
      <option value="card">返信はがき</option>
      <option value="web">Web招待状</option>
    </select>
    <label class="f" for="gift">お祝い</label>
    <select id="gift">
      <option value="send">別でお祝いを贈るつもり</option>
      <option value="none">まだ決めていない</option>
    </select>
  </div>
  <button id="make" type="button">一言を作る</button>

  <div class="card" id="result" hidden style="margin-top:16px">
    <h2>できあがり</h2>
    <div id="sum"></div>
    <h3>メッセージ欄に書く一言</h3>
    <div class="mail" id="msg"></div>
    <button type="button" class="copy" data-t="msg">一言をコピー</button>
    <h3>返信の前に伝える一言</h3>
    <div class="mail" id="pre"></div>
    <button type="button" class="copy" data-t="pre">一言をコピー</button>
    <h3>気をつけたいこと</h3>
    <div class="ng" id="ng"></div>
  </div>

  <p class="note">※書き方の目安です。地域や家の習わし、招待状に書かれている決まりがあれば、そちらに合わせてください。<br>
  最終更新：2026年10月　はじめての係</p>
</main>

<script>
(function () {
  var DEMO = location.search.indexOf("demo") >= 0;
  if (location.search.indexOf("mihon") >= 0) document.body.className = "mihon";
  function $(id) { return document.getElementById(id); }
  function v(id) { return $(id).value.trim(); }
  // 理由の言い方（くだけた形／ていねいな形）。身内の不幸は、お祝いの文では中身を書かない
  var WHY = {
    plan: ["どうしても外せない予定があって", "あいにく外せない先約があり"],
    far: ["遠くて当日の移動が難しくて", "遠方のため"],
    body: ["体調のこともあって", "体調の都合により"],
    loss: ["やむを得ない事情があって", "やむを得ない事情により"],
    other: ["どうしても都合がつかなくて", "やむを得ない事情により"]
  };
  // 返信の前に伝える一言の、理由の部分（くだけた形／ていねいな形）
  var PRE = {
    plan: ["その日はどうしても外せない予定があって、行けそうにないんだ。", "当日はあいにく外せない先約があり、出席できそうにありません。"],
    far: ["遠くて当日の移動が難しくて、行けそうにないんだ。", "遠方のため、当日うかがうのが難しく、出席できそうにありません。"],
    body: ["体調のこともあって、今回は見送ることにしたんだ。", "体調の都合で、今回は大事をとらせていただくことになりました。"],
    loss: ["やむを得ない事情があって、行けそうにないんだ。", "やむを得ない事情があり、当日は出席できそうにありません。"],
    other: ["どうしても都合がつかなくて、行けそうにないんだ。", "やむを得ない事情があり、当日は出席できそうにありません。"]
  };
  function make() {
    var rel = $("rel").value, why = $("why").value, web = $("how").value === "web", gift = $("gift").value === "send";
    var casual = rel === "friend";
    var n = v("nm") || "（相手の呼び方）";
    var r = WHY[why][casual ? 0 : 1];
    var s = $("sum"); s.innerHTML = "";
    var el = document.createElement("div"); el.className = "big";
    el.innerHTML = '<div class="k">一言の組み立て</div><div class="v"></div><div class="s"></div>';
    el.querySelector(".v").textContent = "お祝い → 招待のお礼 → 欠席のおわび（理由は短く） → 二人の幸せを願う";
    el.querySelector(".s").textContent = "最初の一文は「おめでとう」にします。欠席の話から入ると、断りの手紙のように読めてしまいます。" +
      (why === "loss" ? "身内の不幸や法事は、お祝いの文には書かず「やむを得ない事情」とぼかすのが一般的です。" :
       why === "other" ? "理由は言わなくても失礼にはなりません。「やむを得ない事情」で通じます。" :
       "理由は1つだけ、短く書けば足ります。");
    s.appendChild(el);

    var msg;
    if (casual) {
      msg = n + "\nご結婚おめでとう！\n招待してくれてありがとう。\n" + r + "、出席できません。本当にごめんね。\n" +
        "晴れ姿を見られないのは残念だけど、心からお祝いしています。\n" +
        (gift ? "お祝いは別で贈らせてね。\n" : "") + "末永くお幸せに！";
    } else {
      var to = rel === "family" ? n : n + "様";
      if (/(さん|様|さま)$/.test(n)) to = n;
      msg = to + "\nご結婚おめでとうございます。\nお招きいただき、ありがとうございます。\n" + r + "、出席がかなわず申し訳ありません。\n" +
        (gift ? "心ばかりのお祝いをお贈りいたします。\n" : "") + "お二人の末永いお幸せをお祈りしております。";
    }
    $("msg").textContent = msg;

    var pre, p = PRE[why][casual ? 0 : 1];
    if (casual) {
      pre = "（LINEなどで、返信より先に）\n招待ありがとう！すごくうれしかった。\nただ、" + p + "ごめんね。\n" +
        (web ? "Webの返信もこのあと送るね。" : "はがきもこのあと出すね。");
    } else {
      pre = (rel === "family" ? "（電話などで、返信より先に）" : "（職場で、返信より先に口頭で）") +
        "\nこのたびはおめでとうございます。\nお招きいただいたのに申し訳ないのですが、" + p + "\n" +
        (web ? "返信はこのあとWebでお送りします。" : "返信はがきも、このあとお送りします。");
    }
    $("pre").textContent = pre;

    var ng = "・「重ね重ね」「たびたび」「くれぐれも」などのくり返す言葉や、「別れる」「切れる」「終わる」「去る」「戻る」は、お祝いの文では避けるのが一般的です\n";
    if (why === "loss") ng += "・身内の不幸や法事のことは書かない（「やむを得ない事情」とする）\n";
    if (why === "body") ng += "・体調のことは、くわしく書かなくてかまいません。親しい相手なら、返信の前に話しておくと伝わりやすいです\n";
    ng += web
      ? "・Web招待状でも、メッセージ欄を空けずに一言を書く\n・回答の期限を確かめ、決まりしだい早めに返す\n"
      : "・「ご欠席」の「ご」を二重線で消してから「欠席」に丸をつけ、「御出席」は二重線で消す\n・「御住所」「御芳名」の「御」「御芳」も二重線で消す\n・表の宛名の「行」は二重線で消して「様」に直す\n・期限を確かめ、決まりしだい早めに出す\n";
    ng += "・改まった書き方では、句読点（、。）を使わず、空白や改行で区切ることもあります";
    $("ng").textContent = ng;
    $("result").hidden = false;
  }
  [].forEach.call(document.querySelectorAll(".copy"), function (b) {
    b.addEventListener("click", function () {
      var txt = $(b.getAttribute("data-t")).textContent, label = b.textContent;
      var ok = function () { b.textContent = "コピーしました"; setTimeout(function () { b.textContent = label; }, 1500); };
      function fallback() {
        var ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta);
        ta.select(); try { document.execCommand("copy"); ok(); } catch (err) {} document.body.removeChild(ta);
      }
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(ok, fallback); else fallback();
    });
  });
  $("make").addEventListener("click", function () { make(); if (!DEMO) $("result").scrollIntoView({ behavior: "smooth" }); });
  if (DEMO) { $("nm").value = "さき"; $("rel").value = "friend"; $("why").value = "plan"; $("how").value = "card"; make(); }
})();
</script>
</body>
</html>
