<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>職務要約3行の作成｜はじめての係</title>
<style>
  :root {
    --bg: #faf8f5; --card: #ffffff; --text: #2b2b2b; --sub: #6b6b6b;
    --line: #e4dfd8; --accent: #2f6f5e; --accent-soft: #e6f0ec; --input: #fffbe8;
    --warn: #a4412f; --warn-soft: #f8e9e5; --mus: #c99a2e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --card: #26262a; --text: #ececec; --sub: #a5a5a5;
      --line: #3a3a3f; --accent: #7cc4ad; --accent-soft: #23372f; --input: #2e2c22;
      --warn: #f0a08f; --warn-soft: #3d2622; --mus: #e3c578;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", "Meiryo", sans-serif; line-height: 1.7; font-size: 16px; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 0 0 10px; }
  h3 { font-size: .98rem; margin: 18px 0 6px; }
  .lead { color: var(--sub); font-size: .9rem; margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  label.f { display: block; font-weight: 600; margin: 14px 0 6px; }
  .card > label.f:first-of-type { margin-top: 0; }
  .hint { font-weight: 400; color: var(--sub); font-size: .85rem; display: block; }
  input[type=text], input[type=number], select { width: 100%; font-size: 1rem; padding: 9px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--input); color: var(--text); font-family: inherit; }
  .row { display: flex; gap: 8px; } .row > div { flex: 1; min-width: 0; }
  button { width: 100%; font-size: 1rem; font-weight: 700; padding: 12px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; margin-top: 18px; cursor: pointer; font-family: inherit; }
  @media (prefers-color-scheme: dark) { button { color: #10231d; } }
  .copy { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 9px; font-size: .92rem; margin-top: 10px; }
  .big { border-radius: 10px; padding: 12px; margin-bottom: 8px; background: var(--accent-soft); }
  .big .k { font-size: .85rem; color: var(--sub); }
  .big .v { font-size: 1.05rem; font-weight: 700; }
  .big .s { font-size: .88rem; }
  .mail { white-space: pre-wrap; background: var(--input); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: .92rem; }
  .ng { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: .9rem; white-space: pre-wrap; }
  .note { font-size: .8rem; color: var(--sub); }
  [hidden] { display: none !important; }
  .mihon #sum .v, .mihon #sum .s, .mihon #out, .mihon #short, .mihon #ng { filter: blur(6px); user-select: none; }
</style>
</head>
<body>
<main>
  <h1>職務要約3行の作成</h1>
  <p class="lead">職務経歴書のいちばん上に書く「職務要約」を、3行（150字ほど）で作ります。入力した内容は、このページの外には送られません。</p>

  <div class="card">
    <h2>1. これまでの仕事</h2>
    <div class="row">
      <div><label class="f" for="job">いちばん長い職種</label><input type="text" id="job" placeholder="例：一般事務"></div>
      <div><label class="f" for="yrs">年数</label><input type="number" id="yrs" inputmode="numeric" placeholder="例：6"></div>
    </div>
    <label class="f" for="ind">業界・会社の種類<span class="hint">社名は書かなくてよい</span></label>
    <input type="text" id="ind" placeholder="例：住宅設備のメーカー">
    <label class="f" for="task">主にしていたこと（2〜3個、読点で区切る）</label>
    <input type="text" id="task" placeholder="例：受発注の入力、請求書の発行、電話応対">
    <label class="f" for="num">数字で言えること（あれば）</label>
    <input type="text" id="num" placeholder="例：月200件の受発注、入力ミスを半分に">
  </div>

  <div class="card">
    <h2>2. 次の仕事</h2>
    <label class="f" for="next">応募する仕事</label>
    <input type="text" id="next" placeholder="例：営業事務">
    <label class="f" for="str">生かしたい強み</label>
    <select id="str">
      <option value="seikaku">正確さ・ミスの少なさ</option>
      <option value="kairyo">やり方を見直して、早くする</option>
      <option value="taiou">人との調整・やりとり</option>
      <option value="sekinin">任された仕事を最後までやりきる</option>
    </select>
  </div>
  <button id="make" type="button">職務要約を作る</button>

  <div class="card" id="result" hidden style="margin-top:16px">
    <h2>できあがり</h2>
    <div id="sum"></div>
    <h3>職務要約（3行）</h3>
    <div class="mail" id="out"></div>
    <button type="button" class="copy" data-t="out">3行をコピー</button>
    <h3>短い版（応募フォームの欄が小さいとき）</h3>
    <div class="mail" id="short"></div>
    <button type="button" class="copy" data-t="short">短い版をコピー</button>
    <h3>しないほうがいいこと</h3>
    <div class="ng" id="ng"></div>
  </div>

  <p class="note">※文面の目安です。数字は、本当のことだけを書きます。<br>
  最終更新：2026年10月　はじめての係</p>
</main>

<script>
(function () {
  var DEMO = location.search.indexOf("demo") >= 0;
  if (location.search.indexOf("mihon") >= 0) document.body.className = "mihon";
  function $(id) { return document.getElementById(id); }
  function v(id) { return $(id).value.trim(); }
  var S = {
    seikaku: ["正確さを大切にして", "正確で、ミスの少ない仕事"],
    kairyo: ["やり方を見直しながら", "やり方を見直し、早く正確に進める仕事"],
    taiou: ["社内外の人と調整しながら", "人と調整しながら進める仕事"],
    sekinin: ["任された仕事を最後までやりきることを大切に", "責任を持ってやりきる仕事"]
  };
  function make() {
    var job = v("job") || "〇〇", yrs = v("yrs"), ind = v("ind"), task = v("task") || "〇〇、〇〇", num = v("num"), next = v("next") || job, s = S[$("str").value];
    var line1 = (ind ? ind + "で、" : "") + job + "として" + (yrs ? yrs + "年間" : "") + "勤務しました。";
    var line2 = "主に" + task.replace(/,/g, "、") + "を担当しました。" + (num ? num + "をこなしながら、" : "") + s[0] + "仕事を進めてきました。";
    var line3 = "これまでの経験を生かし、" + next + "として" + s[1] + "で貢献したいと考えています。";
    var out = line1 + "\n" + line2 + "\n" + line3;
    var sh = job + (yrs ? yrs + "年" : "") + "。" + task.split(/[、,]/)[0] + "などを担当。" + (num ? num + "。" : "") + s[1] + "が強みです。";
    var len = out.replace(/\n/g, "").length;
    var el = document.createElement("div"); el.className = "big";
    el.innerHTML = '<div class="k">文字数</div><div class="v"></div><div class="s"></div>';
    el.querySelector(".v").textContent = len + "字（目安は100〜200字）";
    el.querySelector(".s").textContent = len > 200 ? "少し長めです。主にしていたことを2つにしぼると読みやすくなります。" : num ? "数字が入っていて、伝わりやすい形です。" : "数字が1つ入ると、ぐっと伝わりやすくなります（件数・人数・期間など）。";
    $("sum").innerHTML = ""; $("sum").appendChild(el);
    $("out").textContent = out;
    $("short").textContent = sh;
    $("ng").textContent = "・業務を全部並べる（3行に入らない分は、職歴の欄に書く）\n・「頑張りました」「努力しました」だけで終わる\n・応募先と関係のない強みを書く";
    $("result").hidden = false;
  }
  [].forEach.call(document.querySelectorAll(".copy"), function (b) {
    b.addEventListener("click", function () {
      var txt = $(b.getAttribute("data-t")).textContent, label = b.textContent;
      var ok = function () { b.textContent = "コピーしました"; setTimeout(function () { b.textContent = label; }, 1500); };
      function fallback() {
        var t = document.createElement("textarea"); t.value = txt; document.body.appendChild(t);
        t.select(); try { document.execCommand("copy"); ok(); } catch (err) {} document.body.removeChild(t);
      }
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(ok, fallback); else fallback();
    });
  });
  $("make").addEventListener("click", function () { make(); if (!DEMO) $("result").scrollIntoView({ behavior: "smooth" }); });
  if (DEMO) { $("job").value = "一般事務"; $("yrs").value = "6"; $("ind").value = "住宅設備のメーカー"; $("task").value = "受発注の入力、請求書の発行、電話応対"; $("num").value = "月200件の受発注"; $("next").value = "営業事務"; make(); }
})();
</script>
</body>
</html>
