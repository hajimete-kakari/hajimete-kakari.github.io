<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>選考辞退の連絡｜はじめての係</title>
<style>
  :root {
    --bg: #faf8f5; --card: #ffffff; --text: #2b2b2b; --sub: #6b6b6b;
    --line: #e4dfd8; --accent: #2f6f5e; --accent-soft: #e6f0ec; --input: #fffbe8;
    --warn: #a4412f; --warn-soft: #f8e9e5; --mus: #c99a2e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --card: #26262a; --text: #ececec; --sub: #a5a5a5;
      --line: #3a3a3f; --accent: #7cc4ad; --accent-soft: #23372f; --input: #2e2c22;
      --warn: #f0a08f; --warn-soft: #3d2622; --mus: #e3c578;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", "Meiryo", sans-serif; line-height: 1.7; font-size: 16px; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 0 0 10px; }
  h3 { font-size: .98rem; margin: 18px 0 6px; }
  .lead { color: var(--sub); font-size: .9rem; margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  label.f { display: block; font-weight: 600; margin: 14px 0 6px; }
  .card > label.f:first-of-type { margin-top: 0; }
  .hint { font-weight: 400; color: var(--sub); font-size: .85rem; display: block; }
  input[type=text], select { width: 100%; font-size: 1rem; padding: 9px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--input); color: var(--text); font-family: inherit; }
  button { width: 100%; font-size: 1rem; font-weight: 700; padding: 12px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; margin-top: 18px; cursor: pointer; font-family: inherit; }
  @media (prefers-color-scheme: dark) { button { color: #10231d; } }
  .copy { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 9px; font-size: .92rem; margin-top: 10px; }
  .big { border-radius: 10px; padding: 12px; margin-bottom: 8px; background: var(--accent-soft); }
  .big .k { font-size: .85rem; color: var(--sub); }
  .big .v { font-size: 1.05rem; font-weight: 700; }
  .big .s { font-size: .88rem; }
  .mail { white-space: pre-wrap; word-break: break-all; background: var(--input); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: .92rem; }
  .ng { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: .9rem; white-space: pre-wrap; }
  .note { font-size: .8rem; color: var(--sub); }
  [hidden] { display: none !important; }
  .mihon #sum .v, .mihon #sum .s, .mihon #subj, .mihon #mail, .mihon #tel, .mihon #reply, .mihon #ng { filter: blur(6px); user-select: none; }
</style>
</head>
<body>
<main>
  <h1>選考辞退の連絡</h1>
  <p class="lead">応募した会社の選考を、内定の前に辞退するときの連絡を作ります。いまの段階・面接までの日数・応募の仕方を選ぶと、連絡の手段とタイミング、メールの件名と本文、電話で言う一言が出ます。入力した内容は、このページの外には送られません。</p>

  <div class="card">
    <h2>1. いまの状況</h2>
    <label class="f" for="stage">選考の段階</label>
    <select id="stage">
      <option value="doc">書類を出して、結果を待っている</option>
      <option value="set">面接の日が決まっている</option>
      <option value="after">面接を受けて、結果を待っている</option>
    </select>
    <label class="f" for="days">面接の日まで<span class="hint">面接の日が決まっているときだけ</span></label>
    <select id="days">
      <option value="far">2日以上ある</option>
      <option value="near">明日、または今日</option>
    </select>
    <label class="f" for="route">応募の仕方</label>
    <select id="route">
      <option value="direct">会社に直接（会社のメール・電話）</option>
      <option value="site">求人サイトのメッセージ機能</option>
      <option value="agent">転職エージェント（担当者）を通して</option>
    </select>
    <label class="f" for="why">辞退の理由<span class="hint">くわしく書かなくてよい</span></label>
    <select id="why">
      <option value="other">ほかの会社に決めた</option>
      <option value="cond">考え直して、働き方が合わないと思った</option>
      <option value="home">家の事情</option>
      <option value="none">理由は書かない（一身上の都合）</option>
    </select>
    <h2 style="margin-top:20px">2. 名前と日にち</h2>
    <label class="f" for="co">会社名</label>
    <input type="text" id="co" placeholder="例：〇〇株式会社">
    <label class="f" for="tan">担当の方の名前<span class="hint">わからなければ空のまま</span></label>
    <input type="text" id="tan" placeholder="例：山本">
    <label class="f" for="job">応募した仕事</label>
    <input type="text" id="job" placeholder="例：営業事務">
    <label class="f" for="date">面接の日時<span class="hint">決まっていなければ空のまま</span></label>
    <input type="text" id="date" placeholder="例：11月5日（木）14時">
    <label class="f" for="me">自分の名前</label>
    <input type="text" id="me" placeholder="例：田中 花子">
  </div>
  <button id="make" type="button">連絡を作る</button>

  <div class="card" id="result" hidden style="margin-top:16px">
    <h2>できあがり</h2>
    <div id="sum"></div>
    <h3>件名</h3>
    <div class="mail" id="subj"></div>
    <button type="button" class="copy" data-t="subj">件名をコピー</button>
    <h3>本文</h3>
    <div class="mail" id="mail"></div>
    <button type="button" class="copy" data-t="mail">本文をコピー</button>
    <h3>電話で言う一言</h3>
    <div class="mail" id="tel"></div>
    <h3>返事が来たら</h3>
    <div class="mail" id="reply"></div>
    <h3>避けたい言い方</h3>
    <div class="ng" id="ng"></div>
  </div>

  <p class="note">※連絡の目安です。会社や求人サイトの案内に、辞退の連絡の仕方が書かれているときは、そちらに合わせてください。内定が出たあとの辞退は、別の連絡になります。<br>
  最終更新：2026年11月　はじめての係</p>
</main>

<script>
(function () {
  var DEMO = location.search.indexOf("demo") >= 0;
  if (location.search.indexOf("mihon") >= 0) document.body.className = "mihon";
  function $(id) { return document.getElementById(id); }
  function v(id) { return $(id).value.trim(); }
  function make() {
    var stage = $("stage").value, days = $("days").value, route = $("route").value, why = $("why").value;
    var co = v("co") || "（会社名）", tan = v("tan"), job = v("job"), date = v("date"), me = v("me") || "（自分の名前）";
    var near = stage === "set" && days === "near";
    var agent = route === "agent";
    var s = $("sum"); s.innerHTML = "";
    function card(k, val, sub) {
      var el = document.createElement("div"); el.className = "big";
      el.innerHTML = '<div class="k"></div><div class="v"></div><div class="s"></div>';
      el.querySelector(".k").textContent = k; el.querySelector(".v").textContent = val; el.querySelector(".s").textContent = sub;
      s.appendChild(el);
    }
    var how, howS;
    if (agent) { how = "エージェントの担当者へ"; howS = "会社へは直接連絡せず、担当者に伝えます。会社への連絡は担当者がしてくれるのが一般的です。"; }
    else if (near) { how = "まず電話、そのあとメール"; howS = "面接の直前は、メールだと当日までに読まれないことがあります。電話で先に伝え、同じ内容をメールでも送っておきます。"; }
    else if (route === "site") { how = "求人サイトのメッセージで"; howS = "やりとりしてきた場所で送ると、相手が見落としにくくなります。"; }
    else { how = "メールで"; howS = stage === "set" ? "面接の日まで余裕があれば、メールで足ります。電話でもかまいません。" : "メールで足ります。急ぐときは電話でもかまいません。"; }
    card("連絡の手段", how, howS);
    card("連絡のタイミング", near ? "今すぐ（会社の営業時間内に電話）" : "決めた日のうちに",
      near ? "面接の準備をしてくれているため、気づいた時点で伝えます。早朝や夜は避け、始業から少したったころや昼休みのあとにかけます。" :
      "辞退を決めたら、先に延ばさず伝えます。早いほど、相手は次の人の選考に進めます。");
    card("理由の書き方", why === "none" ? "「一身上の都合により」で足りる" : "ひとことだけ",
      "選考の途中の辞退では、理由をくわしく書かなくてもかまいません。悪口や比べる言い方は入れず、お礼とおわびを添えます。");
    var W = { other: "ほかの会社への入社を決めたため", cond: "改めて考えた結果、\n希望する働き方と\n合わないと考え", home: "家の事情により", none: "一身上の都合により" }[why];
    var subj;
    if (agent) subj = "選考辞退のご相談（" + co + "様）／" + me;
    else subj = (stage === "set" ? "面接辞退のご連絡" : "選考辞退のご連絡") + "（" + me + "）";
    $("subj").textContent = subj;
    var mail;
    if (agent) {
      mail = "（担当者の名前）様\n\nお世話になっております。\n" + me + "です。\n\n" + co + "様" + (job ? "の\n" + job + "の求人" : "") + "について、\n" +
        W + "、\n選考を辞退したいと考えています。\n" + (date ? "\n面接は" + date + "の予定でした。\n" : "") +
        "\nせっかくご紹介いただいたのに、\n申し訳ありません。\n先方へのご連絡を、\nお願いできますでしょうか。\n\nよろしくお願いいたします。\n\n" + me;
    } else {
      var head = co + "\n" + (tan ? tan + "様" : "採用ご担当者様") + "\n\nお世話になっております。\n" + (job ? job + "に応募しました、\n" : "") + me + "です。\n\n";
      var body;
      if (stage === "set") body = (date ? date + "に\n" : "") + "面接のお時間をいただいて\nおりましたが、\n";
      else if (stage === "after") body = "先日は面接のお時間を\nいただき、ありがとう\nございました。\n";
      else body = "このたびは書類を\nご確認いただき、ありがとう\nございます。\n";
      body += W + "、\n選考を辞退させていただきたく、\nご連絡いたしました。\n";
      var tail = "\n" + (stage === "set" ? "日程を調整していただいたのに、\n" : "お時間を割いていただいたのに、\n") + "申し訳ありません。\n" +
        (near ? "先ほどお電話でも\nお伝えいたしました。\n" : "") + "\n貴社のますますの\nご発展をお祈りいたします。\n\n" + me;
      mail = head + body + tail;
    }
    $("mail").textContent = mail;
    var tel;
    if (agent) tel = "エージェントを通している場合は、\n会社へ電話しなくてかまいません。\n急ぐときは、担当者に電話で\n「" + co + "様の選考を\n辞退したいです」と伝えます。";
    else tel = (tan ? tan + "様は" : "採用ご担当の方は") + "\nいらっしゃいますか。\n\n" + me + "と申します。\n" + (job ? job + "に応募しました。\n" : "") +
      (stage === "set" ? (date ? date + "の\n" : "") + "面接の件ですが、\n" : "") + W + "、\n選考を辞退させていただきたく、\nお電話しました。\n\nご迷惑をおかけして、\n申し訳ありません。";
    $("tel").textContent = tel;
    var reply = agent ? "担当者から「先方に伝えました」と\n来たら、ひとこと返します。\n\nご対応いただき、\nありがとうございました。" :
      "返事が来たら、短く返して終わりにします。\n返事が来なくても、もう一度送らなくて\nよいことが多いです。\n\nご連絡いただき、\nありがとうございました。\n" + (stage === "doc" ? "" : "お時間をいただいたのに、\n申し訳ありませんでした。");
    $("reply").textContent = reply.replace(/\n$/, "");
    var ng = "・連絡しないまま、面接に行かない\n・ほかの会社と比べて、悪く言う\n・言いわけを長く書く";
    if (near) ng += "\n・前日の夜や当日に、メールだけで済ませる";
    if (agent) ng += "\n・担当者を通さず、会社へ直接断る";
    if (stage === "after") ng += "\n・結果が出るまで黙って待つ";
    $("ng").textContent = ng;
    $("result").hidden = false;
  }
  [].forEach.call(document.querySelectorAll(".copy"), function (b) {
    b.addEventListener("click", function () {
      var txt = $(b.getAttribute("data-t")).textContent, label = b.textContent;
      var ok = function () { b.textContent = "コピーしました"; setTimeout(function () { b.textContent = label; }, 1500); };
      function fallback() {
        var ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta);
        ta.select(); try { document.execCommand("copy"); ok(); } catch (err) {} document.body.removeChild(ta);
      }
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(ok, fallback); else fallback();
    });
  });
  $("make").addEventListener("click", function () { make(); if (!DEMO) $("result").scrollIntoView({ behavior: "smooth" }); });
  if (DEMO) {
    $("stage").value = "set"; $("days").value = "far"; $("route").value = "direct"; $("why").value = "other";
    $("co").value = "〇〇株式会社"; $("tan").value = "山本"; $("job").value = "営業事務"; $("date").value = "11月5日（木）14時"; $("me").value = "田中 花子";
    make();
  }
})();
</script>
</body>
</html>
